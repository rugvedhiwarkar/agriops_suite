/* ============================================================
   Big-touch field UI — sized for wet / dirty / gloved hands:
   large targets (>=60px), thick borders, generous gaps, high
   contrast for sunlight. Keep the VAC green identity.
   ============================================================ */
:root {
	--green: #166b41;
	--green-dark: #0c4227;
	--green-soft: #dcece3;
	--ivory: #f4f3ec;
	--card: #ffffff;
	--ink: #1a1a15;
	--muted: #565549;
	--line: #c7c5b8;
	--line-2: #b3b1a2;
	--amber: #9a4a08;
	--amber-soft: #fbe9cf;
	--blue: #24418f;
	--blue-soft: #dde5fb;
	--red: #a81919;
	--red-soft: #fbe3e3;
	--radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 18px; }
body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
	background: var(--ivory); color: var(--ink);
	min-height: 100vh; overscroll-behavior-y: contain;
	-webkit-text-size-adjust: 100%;
}
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; }
input { font: inherit; color: inherit; }
#app { max-width: 520px; margin: 0 auto; padding-bottom: 48px; }

/* header */
.hdr {
	position: sticky; top: 0; z-index: 20;
	background: var(--green); color: #fff;
	padding: 12px 12px;
	display: flex; align-items: center; gap: 9px;
	box-shadow: 0 2px 10px rgba(0,0,0,.22);
}
.hdr .hgrow { flex: 1; min-width: 0; }
.hdr .ttl { font-size: 1.2rem; font-weight: 800; letter-spacing: .3px; }
.hdr .who { font-size: .85rem; opacity: .9; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.netdot { width: 13px; height: 13px; border-radius: 50%; background: #8ff2ba; box-shadow: 0 0 7px #8ff2ba; flex: 0 0 auto; }
.netdot.off { background: #f6b33f; box-shadow: none; }
.hdr .iconbtn {
	min-width: 50px; height: 50px; border-radius: 13px; font-size: 1.5rem;
	background: rgba(255,255,255,.16); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.hdr .iconbtn:active { background: rgba(255,255,255,.34); }
.hdr .iconbtn.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pendbadge {
	background: #fff; color: var(--green-dark); font-weight: 800; font-size: .9rem;
	border-radius: 999px; padding: 5px 12px; flex: 0 0 auto;
}

/* offline banner */
.offbar {
	background: var(--amber-soft); color: var(--amber);
	font-size: .98rem; font-weight: 700; text-align: center;
	padding: 11px 12px; border-bottom: 2px solid #eccfa2;
}

/* cards & form */
.card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 5px rgba(40,40,20,.09); margin: 14px 12px; padding: 18px 16px; }
.flabel { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.12rem; margin: 22px 2px 10px; }
.flabel:first-child { margin-top: 4px; }
.flabel .num {
	background: var(--green); color: #fff;
	border-radius: 9px; min-width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
	font-size: 1rem; font-weight: 800; flex: 0 0 auto;
}
.flabel .hint { font-weight: 600; font-size: .85rem; color: var(--muted); }
.tin {
	width: 100%; border: 2.5px solid var(--line-2); border-radius: 13px;
	padding: 15px 15px; font-size: 1.25rem; background: #fff; min-height: 60px;
}
.tin:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }
.chip {
	border: 2.5px solid var(--line-2); border-radius: 999px; padding: 13px 18px;
	font-size: 1.05rem; font-weight: 700; background: #fff; white-space: nowrap; min-height: 56px;
}
.chip:active, .chip.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }

/* big toggle (from-place) */
.fromgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fromgrid button {
	border: 2.5px solid var(--line-2); border-radius: var(--radius); background: #fff;
	padding: 16px 10px; text-align: center; min-height: 96px;
}
.fromgrid .b1 { font-weight: 800; font-size: 1.08rem; }
.fromgrid .b2 { font-size: .85rem; color: var(--muted); margin-top: 5px; }
.fromgrid button.on { border-color: var(--green); background: var(--green-soft); border-width: 3px; }
.fromgrid button.on .b1 { color: var(--green-dark); }
.dirhint { margin-top: 10px; font-size: 1.02rem; font-weight: 800; text-align: center; border-radius: 11px; padding: 11px; }
.dirhint.pur { background: var(--green-soft); color: var(--green-dark); }
.dirhint.sal { background: var(--blue-soft); color: var(--blue); }

/* item grid */
.itemgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.itemgrid button {
	border: 2.5px solid var(--line-2); border-radius: var(--radius); background: #fff;
	padding: 14px 10px; min-height: 76px; font-weight: 700; font-size: 1rem; line-height: 1.25;
}
.itemgrid button.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); border-width: 3px; }
.itemgrid button.more { border-style: dashed; color: var(--muted); font-weight: 700; }
/* goods lines (multi-item) */
.lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.line {
	display: flex; align-items: center; gap: 12px;
	background: var(--green-soft); color: var(--green-dark);
	border-radius: 12px; padding: 14px 14px; font-size: 1.12rem;
}
.line .lt { flex: 1; min-width: 0; }
.line .lx {
	min-width: 52px; height: 52px; border-radius: 12px; font-size: 1.3rem; font-weight: 800;
	background: rgba(0,0,0,.08); color: var(--red); flex: 0 0 auto;
}
.addline {
	width: 100%; margin-top: 12px; border: 2.5px dashed var(--green); color: var(--green-dark);
	border-radius: 13px; padding: 15px; font-size: 1.12rem; font-weight: 800; background: #fff; min-height: 60px;
}
.addline:active { background: var(--green-soft); }

/* qty */
.qtyrow { display: flex; gap: 12px; align-items: stretch; }
.qtyrow .tin { text-align: center; font-size: 1.9rem; font-weight: 800; }
.qbtn {
	min-width: 68px; border: 2.5px solid var(--line-2); border-radius: 13px; background: #fff;
	font-size: 2rem; font-weight: 800; color: var(--green-dark);
}
.qbtn:active { background: var(--green-soft); }

/* photo */
.photorow { display: flex; align-items: center; gap: 13px; margin-top: 6px; }
.pbtn {
	flex: 1; border: 2.5px dashed var(--line-2); border-radius: 13px; padding: 16px 12px;
	font-weight: 700; color: var(--muted); font-size: 1.02rem; text-align: center; min-height: 60px;
}
.pthumb { width: 66px; height: 66px; border-radius: 12px; object-fit: cover; display: none; border: 2.5px solid var(--line-2); flex: 0 0 auto; }
.pthumb.show { display: block; }

/* primary action button */
.save {
	width: 100%; margin-top: 24px; background: var(--green); color: #fff;
	border-radius: var(--radius); padding: 20px; font-size: 1.4rem; font-weight: 800; min-height: 66px;
	box-shadow: 0 4px 14px rgba(22,107,65,.4); letter-spacing: .2px;
}
.save:active { background: var(--green-dark); transform: translateY(1px); }
.save.alt { background: var(--card); color: var(--green-dark); border: 2.5px solid var(--green); box-shadow: none; }
.save.alt:active { background: var(--green-soft); }
.save.danger { background: var(--red); box-shadow: 0 4px 14px rgba(168,25,25,.35); }
.save:disabled { opacity: .6; }

/* queue list */
.qhead { display: flex; align-items: center; margin: 24px 16px 4px; gap: 8px; }
.qhead h2 { font-size: 1.05rem; color: var(--muted); font-weight: 800; }
.qitem { display: flex; gap: 12px; align-items: center; padding: 16px 6px; border-bottom: 1.5px solid var(--line); }
.qitem:last-child { border-bottom: 0; }
.qitem .qi1 { font-weight: 800; font-size: 1.06rem; }
.qitem .qi2 { font-size: .9rem; color: var(--muted); margin-top: 3px; }
.qitem .grow { flex: 1; min-width: 0; }
.badge { font-size: .86rem; font-weight: 800; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.badge.wait { background: var(--amber-soft); color: var(--amber); }
.badge.ok { background: var(--green-soft); color: var(--green-dark); }
.badge.err { background: var(--red-soft); color: var(--red); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px 10px; font-size: 1.02rem; line-height: 1.6; }

.loginwrap { padding: 40px 22px 60px; text-align: center; max-width: 460px; margin: 0 auto; }

.langrow2 { display: flex; gap: 10px; margin-top: 6px; }

.langrow2 button.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
.pairerr { color: var(--red); font-weight: 800; font-size: 1rem; margin-top: 14px; min-height: 1.3em; }
.qrlink { display: block; width: 100%; margin-top: 20px; color: var(--green-dark); font-weight: 800; font-size: 1.08rem; text-decoration: underline; padding: 12px; min-height: 48px; }

/* mode tabs */
.tabs { display: flex; background: var(--green-dark); position: sticky; top: 0; z-index: 19; }
.tabs .tab { flex: 1; color: #c4e4d3; font-weight: 800; font-size: 1.12rem; padding: 16px 8px; border-bottom: 4px solid transparent; letter-spacing: .3px; min-height: 58px; }
.tabs .tab.on { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,.08); }

.dcard { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 5px rgba(40,40,20,.09); margin: 14px 12px; padding: 17px 16px; display: flex; gap: 12px; align-items: stretch; }

.dcard .cust { font-weight: 800; font-size: 1.22rem; line-height: 1.25; }

.dbadge.todo { background: var(--blue-soft); color: var(--blue); }
.dbadge.wait { background: var(--amber-soft); color: var(--amber); }
.dbadge.ok { background: var(--green-soft); color: var(--green-dark); }
.dbadge.err { background: var(--red-soft); color: var(--red); }

/* delivery detail */
.dback { display: flex; align-items: center; gap: 8px; margin: 14px 12px 0; }
.dback button { min-width: 52px; height: 52px; font-size: 1.7rem; color: var(--green-dark); border-radius: 12px; background: var(--card); box-shadow: 0 1px 4px rgba(40,40,20,.1); flex: 0 0 auto; }
.dtitle { font-weight: 800; font-size: 1.28rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* search overlay */
.ovl { position: fixed; inset: 0; background: var(--ivory); z-index: 50; display: none; flex-direction: column; }

.ovl .obar { display: flex; gap: 10px; padding: 12px; background: var(--green); }

.ovl .olist { flex: 1; overflow-y: auto; padding: 8px 12px 40px; }

	display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line);

.ovl .olist button:active { background: var(--green-soft); }
.ovl .olist .uom { color: var(--muted); font-size: .88rem; font-weight: 600; }

/* toast */
#toast {
	position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(110px);
	background: var(--ink); color: #fff; border-radius: 13px; padding: 15px 24px;
	font-weight: 800; font-size: 1.08rem; z-index: 99; transition: transform .25s ease; max-width: 92vw;
	box-shadow: 0 6px 22px rgba(0,0,0,.34);
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>

/* ---------- tiny IndexedDB wrapper ---------- */
var _db = null;
function db() {
	return _db ? Promise.resolve(_db) : new Promise(function (res, rej) {
		var r = indexedDB.open("vacslip", 2);
		r.onupgradeneeded = function () {
			var d = r.result;
			if (!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", { keyPath: "uid" });
			if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "uid" });
			if (!d.objectStoreNames.contains("deliveries")) d.createObjectStore("deliveries", { keyPath: "name" });
			if (!d.objectStoreNames.contains("delivconfirm")) d.createObjectStore("delivconfirm", { keyPath: "name" });
			if (!d.objectStoreNames.contains("delivphotos")) d.createObjectStore("delivphotos", { keyPath: "name" });
		};
		r.onsuccess = function () { _db = r.result; res(_db); };
		r.onerror = function () { rej(r.error); };
	});
}
function idbPut(st, v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction(st, "readwrite"); t.objectStore(st).put(v); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbDel(st, k) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction(st, "readwrite"); t.objectStore(st).delete(k); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbGet(st, k) { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction(st).objectStore(st).get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbAll(st) { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction(st).objectStore(st).getAll(); q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { rej(q.error); }; }); }); }

/* ---------- auth (session cookie + CSRF, OR device token) ---------- */
var TOKEN = LS.vacslip_token || "";   /* QR / kiosk device token (key:secret) */
var CSRF = "";                        /* session CSRF token (email+password login) */
var AUTHED = false;
var AUTH = null;                      /* { user, full_name } */
function haveAuth() { return !!TOKEN || AUTHED; }

function api(path, opts) {
	opts = opts || {};
	var headers = opts.headers || {};
	if (TOKEN) headers["Authorization"] = "token " + TOKEN;
	else if (CSRF) headers["X-Frappe-CSRF-Token"] = CSRF;
	var body = opts.body;
	if (opts.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(opts.json); }
	return fetch(path, { method: opts.method || "GET", headers: headers, body: body, credentials: "same-origin" }).catch(function () {
		throw { net: true, message: T("login_net") };
	}).then(function (res) {
		if (res.status === 401 || res.status === 403) throw { auth: true, message: T("login_bad") };
		return res.text().then(function (text) {
			var data = {};
			try { data = JSON.parse(text); } catch (e) { }
			if (!res.ok) {
				var m = data.exception || ("HTTP " + res.status);
				if (data._server_messages) {
					try { m = JSON.parse(JSON.parse(data._server_messages)[0]).message || m; } catch (e) { }
				}
				throw { message: String(m).replace(/<[^>]*>/g, "").slice(0, 160) };
			}
			return data;
		});
	});
}

function ensureAuth() {
	if (!navigator.onLine) {
		AUTHED = LS.vacslip_authed === "1" || !!TOKEN;
		if (AUTHED && !AUTH) { try { AUTH = JSON.parse(LS.vacslip_auth || "null"); } catch (e) { } }
		return Promise.resolve(AUTHED);
	}
	if (TOKEN) {
		/* device-token path: validate + prime the boot cache in one call */
		return api("/api/method/driver_slip_bootstrap", { method: "POST" }).then(function (r) {
			var b = r.message || {}; b.ts = Date.now();
			LS.vacslip_boot = JSON.stringify(b);
			AUTH = { user: b.driver, full_name: b.driver }; AUTHED = true;
			LS.vacslip_authed = "1"; LS.vacslip_auth = JSON.stringify(AUTH);
			return true;
		}).catch(function () { AUTHED = false; LS.removeItem("vacslip_authed"); return false; });
	}
	/* session path: 403 here == "no valid session" == show login */
	return fetch("/api/method/agriops_suite.slip.csrf", { credentials: "same-origin" })
		.then(function (r) { return r.ok ? r.json() : null; })
		.then(function (j) {
			var m = j && j.message;
			if (m && m.csrf_token) {
				CSRF = m.csrf_token; AUTH = { user: m.user, full_name: m.full_name }; AUTHED = true;
				LS.vacslip_authed = "1"; LS.vacslip_auth = JSON.stringify(AUTH);
				return true;
			}
			AUTHED = false; LS.removeItem("vacslip_authed");
			return false;
		})
		.catch(function () { AUTHED = LS.vacslip_authed === "1"; return AUTHED; });
}
function needLogin() { AUTHED = false; CSRF = ""; LS.removeItem("vacslip_authed"); renderLogin(""); }

function renderLogin(err) {
	CURVIEW = "login";
	var langs = LANGS.map(function (l) { return '<button class="' + (l.code === LANG ? "on" : "") + '" onclick="setLang(\'' + l.code + '\')">' + esc(l.label) + "</button>"; }).join("");
	$id("app").innerHTML =
		'<div class="loginwrap">' +
		'<div class="logo">V</div>' +
		"<h1>" + esc(T("login_h")) + "</h1>" +
		'<div class="langrow">' + langs + "</div>" +
		"<p>" + esc(T("login_sub")) + "</p>" +
		'<input id="lem" class="tin" type="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(T("login_email")) + '">' +
		'<input id="lpw" class="tin" type="password" placeholder="' + esc(T("login_pw")) + '">' +
		'<button id="lbtn" class="save" onclick="doLogin()">' + esc(T("login_go")) + "</button>" +
		'<div id="lerr" class="pairerr">' + esc(err || "") + "</div>" +
		'<button class="qrlink" onclick="toggleQR()">' + esc(T("login_qr")) + "</button>" +
		'<div id="qrbox" style="display:none">' +
		'<input id="pairin" class="tin" placeholder="' + esc(T("login_code")) + '" autocomplete="off" autocapitalize="off" spellcheck="false">' +
		'<button id="pairgo" class="save alt" onclick="doPair()">' + esc(T("login_pair")) + "</button>" +
		"</div></div>";
	var pw = $id("lpw");
	if (pw) pw.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
}
function toggleQR() { var b = $id("qrbox"); if (b) b.style.display = (b.style.display === "none" ? "block" : "none"); }
function doLogin() {
	var email = (($id("lem") || {}).value || "").trim();
	var pw = ($id("lpw") || {}).value || "";
	if (!email || !pw) { renderLogin(T("login_bad")); if ($id("lem")) $id("lem").value = email; return; }
	var btn = $id("lbtn"); if (btn) { btn.disabled = true; btn.textContent = T("login_ing"); }
	fetch("/api/method/login", {
		method: "POST",
		headers: { "Content-Type": "application/x-www-form-urlencoded" },
		body: "usr=" + encodeURIComponent(email) + "&pwd=" + encodeURIComponent(pw),
		credentials: "same-origin"
	}).then(function (r) {
		if (r.status === 429) throw { m: T("login_locked") };
		if (!r.ok) throw { m: T("login_bad") };
		TOKEN = ""; LS.removeItem("vacslip_token");   /* email login => session path */
		return ensureAuth();
	}).then(function (ok) { if (!ok) throw { m: T("login_bad") }; boot(); })
		.catch(function (e) { renderLogin(e && e.m ? e.m : T("login_net")); if ($id("lem")) $id("lem").value = email; });
}
function doPair() {
	$id("lerr").textContent = T("login_ing");

		boot(); toast(T("paired"));

}
function doLogout() {
	fetch("/api/method/logout", { credentials: "same-origin" }).catch(function () { }).then(function () {
		CSRF = ""; AUTHED = false; AUTH = null; TOKEN = "";
		LS.removeItem("vacslip_authed"); LS.removeItem("vacslip_token"); LS.removeItem("vacslip_boot");
		toast(T("bye")); renderLogin("");
	});
}

/* ---------- bootstrap cache (driver name, shortlist, item master) ---------- */
function getBoot() { try { return JSON.parse(LS.vacslip_boot || "null"); } catch (e) { return null; } }
function refreshBoot(force) {
	var boot = getBoot();
	if (!force && boot && Date.now() - boot.ts < 24 * 3600 * 1000) return Promise.resolve(boot);
	if (!navigator.onLine && boot) return Promise.resolve(boot);
	return api("/api/method/driver_slip_bootstrap", { method: "POST" }).then(function (r) {
		var b = r.message || {}; b.ts = Date.now();
		LS.vacslip_boot = JSON.stringify(b);
		return b;
	}).catch(function (e) {
		if (e.auth && !boot) throw e;
		return boot; // stale is fine offline
	});
}
function itemLabel(code) {
	var b = getBoot();
	if (b && b.items) for (var i = 0; i < b.items.length; i++) if (b.items[i].name === code) return b.items[i].item_name || code;
	return code;
}

/* ---------- recent destinations ---------- */
function getDests() { try { return JSON.parse(LS.vacslip_dests || "[]"); } catch (e) { return []; } }
function pushDest(d) {
	if (!d) return;
	var a = getDests().filter(function (x) { return x !== d; });
	a.unshift(d);
	LS.vacslip_dests = JSON.stringify(a.slice(0, 15));
}

/* ---------- sync engine (transfer slips) ---------- */
var syncing = false;
function syncNow() {
	if (syncing || !navigator.onLine || !haveAuth()) { updateNet(); return Promise.resolve(); }
	syncing = true; updateNet();
	return idbAll("queue").then(function (items) {
		items.sort(function (a, b) { return a.created_at - b.created_at; });
		var chain = Promise.resolve();
		items.filter(function (x) { return x.state === "queued" || x.state === "error"; }).forEach(function (q) {
			chain = chain.then(function () {
				return api("/api/method/driver_slip_submit", {
					method: "POST",
					json: {
						client_uid: q.uid, slip_date: q.slip_date, challan_no: q.challan_no,
						from_place: q.from_place, destination: q.destination,
						items: (q.items || []).map(function (l) { return { item: l.item, qty: l.qty }; })
					}
				}).then(function (r) {
					q.server_name = (r.message || {}).name || "";
					q.state = q.has_photo ? "synced" : "done";
					q.err = "";
					return idbPut("queue", q).then(renderList);
				}).catch(function (e) {
					if (e.auth) { needLogin(); throw e; }
					if (e.net) throw e; // stop the chain, we're offline
					q.state = "error"; q.err = e.message || "?";
					return idbPut("queue", q).then(renderList);
				});
			});
		});
		return chain.then(function () { return idbAll("queue"); });
	}).then(function (items) {
		// photo follow-ups (best-effort, after the slip itself is safe)
		var chain = Promise.resolve();
		items.filter(function (x) { return x.state === "synced"; }).forEach(function (q) {
			chain = chain.then(function () {
				return idbGet("photos", q.uid).then(function (ph) {
					if (!ph || !ph.blob) { q.state = "done"; return idbPut("queue", q).then(renderList); }
					var fd = new FormData();
					fd.append("file", ph.blob, q.uid + ".jpg");
					fd.append("is_private", "1");
					fd.append("doctype", "Driver Slip");
					fd.append("docname", q.server_name);
					fd.append("fieldname", "slip_photo");
					return api("/api/method/upload_file", { method: "POST", body: fd }).then(function (up) {
						var furl = (up.message || {}).file_url;
						var setField = furl
							? api("/api/resource/Driver Slip/" + encodeURIComponent(q.server_name), { method: "PUT", json: { slip_photo: furl } }).catch(function (e) { if (e.auth) throw e; })
							: Promise.resolve();
						return setField.then(function () {
							q.state = "done";
							return idbDel("photos", q.uid).then(function () { return idbPut("queue", q); }).then(renderList);
						});
					}).catch(function (e) {
						if (e.auth) { needLogin(); throw e; }
						/* keep photo queued for a later pass */
					});
				});
			});
		});
		return chain;
	}).catch(function () { /* offline or auth — queue stays */ })
		.then(function () { syncing = false; updateNet(); renderList(); });
}

/* ---------- ui helpers ---------- */
var toastTimer = null;
function toast(msg) {
	var t = $id("toast"); t.textContent = msg; t.classList.add("show");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function today() {
	var d = new Date();
	return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function niceDate(iso) {
	if (!iso) return "";
	var p = String(iso).split("-");
	return p.length === 3 ? p[2].slice(0, 2) + "/" + p[1] : String(iso);
}
function uidNew() {
	return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "u" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
function fmtQty(q) { var n = parseFloat(q); return isNaN(n) ? "" : String(n); }

/* ---------- QR pairing (device token; the login-screen alternative) ---------- */
function checkPairFromHash() {
	var m = (location.hash || "").match(/[#&]pair=([^&]+)/);
	if (m) {
		LS.vacslip_token_candidate = decodeURIComponent(m[1]).trim();
		history.replaceState(null, "", location.pathname);
	}
}
function tryPair(tok) {
	tok = (tok || "").trim();
	if (!tok || tok.indexOf(":") < 1) return Promise.reject({ message: T("login_bad") });
	var prev = LS.vacslip_token;
	LS.vacslip_token = tok; TOKEN = tok;
	return api("/api/method/driver_slip_bootstrap", { method: "POST" }).then(function (r) {
		var b = r.message || {}; b.ts = Date.now();
		LS.vacslip_boot = JSON.stringify(b);
		delete LS.vacslip_token_candidate;
		return b;
	}).catch(function (e) {
		if (prev) { LS.vacslip_token = prev; TOKEN = prev; } else { LS.removeItem("vacslip_token"); TOKEN = ""; }
		throw e.net ? { message: T("login_net") } : { message: T("login_bad") };
	});
}

function shrinkImage(file) {
	return new Promise(function (res) {
		var img = new Image();
		img.onload = function () {
			var MAX = 1600;
			var w = img.width, h = img.height;
			if (w > MAX || h > MAX) { var k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
			var c = document.createElement("canvas");
			c.width = w; c.height = h;
			c.getContext("2d").drawImage(img, 0, 0, w, h);
			c.toBlob(function (b) { res(b || file); URL.revokeObjectURL(img.src); }, "image/jpeg", 0.72);
		};
		img.onerror = function () { res(file); };
		img.src = URL.createObjectURL(file);
	});
}

function saveSlip() {

	var dest = $id("f_dest").value.trim();
	if (!date) return toast(T("v_date"));
	if (!challan) return toast(T("v_bill"));
	if (!F.from_place) return toast(T("v_from"));
	if (!F.lines.length) return toast(T("v_goods"));

	var q = {
		uid: uidNew(),
		slip_date: date, challan_no: challan, from_place: F.from_place,
		items: F.lines.slice(), destination: dest,
		has_photo: !!F.photo, state: "queued", server_name: "", err: "",
		created_at: Date.now()
	};
	var photo = F.photo;
	idbPut("queue", q).then(function () {
		if (photo) return idbPut("photos", { uid: q.uid, blob: photo });
	}).then(function () {
		pushDest(dest);
		F.photo = null; F.lines = []; curItem = ""; F.destination = "";
		var num = parseInt(challan, 10);
		F.challan_no = isNaN(num) ? "" : String(num + 1);
		F.slip_date = date;
		renderMain();
		toast(T("slip_saved"));
		syncNow();
	}).catch(function () { toast(T("save_fail")); });
}

		items = items.filter(function (x) { return !(x.state === "done" && x.created_at < cutoff); }).slice(0, 30);

		updatePend();

/* ============================================================
   Deliveries (office -> driver): assigned Sales Invoices + POD.
   ============================================================ */
var MODE = "deliv";

function setMode(m) {
	MODE = m; LS.vacslip_mode = m;
	if (m === "deliv") { renderDeliveries(); refreshDeliveries(); }
	else renderMain();
}

function stripAddr(html) {
	if (!html) return "";
	return html.replace(/<br\s*\/?>/gi, ", ").replace(/<[^>]*>/g, "")
		.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
		.replace(/\s+/g, " ").replace(/(,\s*)+/g, ", ").replace(/^[,\s]+|[,\s]+$/g, "").trim();
}

function delivEffective(x, cmap) {
	var c = cmap[x.name];
	return {
		delivered: (x.status === "Delivered") || (!!c && c.state !== "error"),
		pending: !!c && (c.state === "queued" || c.state === "photo"),
		error: !!c && c.state === "error"
	};
}

function renderDeliveries() {
	CURVIEW = "home";
	var el = $id("app");
	el.innerHTML = headerHtml("deliv") + '<div id="delivwrap"></div>';
	wireTabs();
	var sb = $id("syncbtn");
	if (sb) sb.onclick = function () { toast(T("checking")); refreshDeliveries(); syncAll(); };
	updateNet();
	renderDelivList();
}

function renderDelivList() {
	var wrap = $id("delivwrap");
	if (!wrap) return;
	Promise.all([idbAll("deliveries"), idbAll("delivconfirm")]).then(function (res) {
		var list = res[0] || [], confirms = res[1] || [];
		var cutoff = Date.now() - 3 * 24 * 3600 * 1000;
		confirms.filter(function (c) { return c.state === "done" && c.created_at < cutoff; })
			.forEach(function (c) { idbDel("delivconfirm", c.name); idbDel("delivphotos", c.name); });
		var cmap = {}; confirms.forEach(function (c) { cmap[c.name] = c; });
		list.forEach(function (x) { x._e = delivEffective(x, cmap); });
		list.sort(function (a, b) {
			if (a._e.delivered !== b._e.delivered) return a._e.delivered ? 1 : -1;
			return (b.posting_date || "").localeCompare(a.posting_date || "");
		});
		updatePend();
		if (!list.length) {
			wrap.innerHTML = '<div class="empty" style="padding:48px 24px">' + T("deliv_empty") + "</div>";
			return;
		}
		wrap.innerHTML = "";
		list.forEach(function (x) {
			var goods = (x.items || []).map(function (l) { return (l.item_name || "") + "×" + fmtQty(l.qty); }).join(", ");
			var loc = [x.village, x.phone].filter(Boolean).join(" · ");
			var badge;
			if (x._e.error) badge = '<span class="dbadge err">' + esc(T("b_err")) + "</span>";
			else if (x._e.pending) badge = '<span class="dbadge wait">' + esc(T("b_sending")) + "</span>";
			else if (x._e.delivered) badge = '<span class="dbadge ok">' + esc(T("b_delivered")) + "</span>";
			else badge = '<span class="dbadge todo">' + esc(T("b_todo")) + "</span>";
			var d = document.createElement("div");
			d.className = "dcard";
			d.innerHTML =
				'<div class="body">' +
				'<div class="cust">' + esc(x.customer_name) + "</div>" +
				(loc ? '<div class="meta">' + esc(loc) + "</div>" : "") +
				'<div class="goods">' + esc(goods) + "</div>" +
				badge +
				'<div class="meta">' + esc(x.name) + " · " + niceDate(x.posting_date) + "</div>" +
				'</div><div class="chev">›</div>';
			d.onclick = function () { renderDelivDetail(x.name); };
			wrap.appendChild(d);
		});
	});
}

function renderDelivDetail(name) {
	CURVIEW = "detail"; CURARG = name;
	Promise.all([idbGet("deliveries", name), idbGet("delivconfirm", name)]).then(function (res) {
		var x = res[0], c = res[1];
		if (!x) { setMode("deliv"); return; }
		var cmap = {}; if (c) cmap[name] = c;
		var e = delivEffective(x, cmap);
		var addr = stripAddr(x.address_html);
		var itemsHtml = (x.items || []).map(function (l) {
			return '<div class="ditem"><span>' + esc(l.item_name || "") + "</span><b>" + fmtQty(l.qty) + " " + esc(l.uom || "") + "</b></div>";
		}).join("");
		var actionHtml;
		if (e.delivered) {
			actionHtml = '<div class="dbadge ok" style="display:block;text-align:center;padding:16px;margin-top:20px;font-size:1.05rem">' +
				(e.pending ? esc(T("delivered_sending")) : (e.error ? esc(T("delivered_err")) : esc(T("delivered_ok")))) +
				(x.delivered_at ? '<div style="font-weight:600;margin-top:5px">' + esc(x.delivered_at) + "</div>" : "") +
				"</div>";
		} else {
			actionHtml =
				'<div class="photorow" style="margin-top:20px">' +
				'<button id="dpbtn" class="pbtn">' + esc(T("pod_btn")) + "</button>" +
				'<img id="dpthumb" class="pthumb" alt="">' +
				'<input id="dphoto" type="file" accept="image/*" capture="environment" style="display:none">' +
				"</div>" +
				'<button id="ddeliver" class="save">' + esc(T("deliver_btn")) + "</button>";
		}
		$id("app").innerHTML =
			headerHtml("deliv") +
			'<div class="dback"><button id="dbk">←</button><div class="dtitle">' + esc(x.customer_name) + "</div></div>" +
			'<div class="card">' +
			(x.village ? '<div class="drow"><span class="k">' + esc(T("d_village")) + '</span><span class="v">' + esc(x.village) + "</span></div>" : "") +
			(addr ? '<div class="drow"><span class="k">' + esc(T("d_addr")) + '</span><span class="v">' + esc(addr) + "</span></div>" : "") +
			'<div class="drow"><span class="k">' + esc(T("d_billno")) + '</span><span class="v">' + esc(x.name) + "</span></div>" +
			'<div class="drow"><span class="k">' + esc(T("d_date")) + '</span><span class="v">' + niceDate(x.posting_date) + "</span></div>" +
			'<div class="flabel" style="margin-top:16px">' + esc(T("d_goods")) + "</div>" +
			(itemsHtml || '<div class="empty">' + esc(T("d_nogoods")) + "</div>") +
			(x.phone ? '<a class="callbtn" href="tel:' + encodeURIComponent(x.phone) + '">📞 ' + esc(x.phone) + " " + esc(T("call_suffix")) + "</a>" : "") +
			actionHtml +
			"</div>";
		wireTabs();
		var sb = $id("syncbtn"); if (sb) sb.onclick = function () { toast(T("send_toast")); syncAll(); };
		updateNet();
		$id("dbk").onclick = function () { setMode("deliv"); };

		var pending = { blob: null };
		var pin = $id("dphoto");
		if (pin) {
			$id("dpbtn").onclick = function () { pin.click(); };
			pin.onchange = function () {
				var f = this.files && this.files[0];
				if (!f) return;
				shrinkImage(f).then(function (blob) {
					pending.blob = blob;
					var t = $id("dpthumb"); t.src = URL.createObjectURL(blob); t.classList.add("show");
					$id("dpbtn").textContent = T("pod_done");
				});
			};
		}
		var dv = $id("ddeliver");
		if (dv) dv.onclick = function () { confirmDelivery(x, pending.blob); };
	});
}

function confirmDelivery(x, blob) {
	var rec = { name: x.name, state: "queued", has_photo: !!blob, err: "", created_at: Date.now() };
	idbPut("delivconfirm", rec).then(function () {
		if (blob) return idbPut("delivphotos", { name: x.name, blob: blob });
	}).then(function () {
		x.status = "Delivered";
		return idbPut("deliveries", x);
	}).then(function () {
		toast(T("pod_saved"));
		setMode("deliv");
		syncDeliv();
	}).catch(function () { toast(T("fail_retry")); });
}

function refreshDeliveries() {
	if (!navigator.onLine || !haveAuth()) return Promise.resolve();
	return api("/api/method/driver_deliveries_list", { method: "POST" }).then(function (r) {
		var list = (r.message || {}).deliveries || [];
		return db().then(function (d) {
			return new Promise(function (res, rej) {
				var t = d.transaction("deliveries", "readwrite");
				var st = t.objectStore("deliveries");
				st.clear();
				list.forEach(function (x) { st.put(x); });
				t.oncomplete = function () { res(); };
				t.onerror = function () { rej(t.error); };
			});
		}).then(function () { if (MODE === "deliv" && CURVIEW === "home") renderDelivList(); else updatePend(); });
	}).catch(function (e) { if (e.auth) needLogin(); });
}

function syncDeliv() {
	if (!navigator.onLine || !haveAuth()) { updateNet(); return Promise.resolve(); }
	return idbAll("delivconfirm").then(function (items) {
		var chain = Promise.resolve();
		items.filter(function (x) { return x.state === "queued" || x.state === "error"; }).forEach(function (q) {
			chain = chain.then(function () {
				return api("/api/method/driver_delivery_confirm", { method: "POST", json: { invoice: q.name } }).then(function () {
					q.state = q.has_photo ? "photo" : "done"; q.err = "";
					return idbPut("delivconfirm", q).then(function () { if (MODE === "deliv" && CURVIEW === "home") renderDelivList(); });
				}).catch(function (e) {
					if (e.auth) { needLogin(); throw e; }
					if (e.net) throw e;
					q.state = "error"; q.err = e.message || "?";
					return idbPut("delivconfirm", q).then(function () { if (MODE === "deliv" && CURVIEW === "home") renderDelivList(); });
				});
			});
		});
		return chain.then(function () { return idbAll("delivconfirm"); });
	}).then(function (items) {
		var chain = Promise.resolve();
		items.filter(function (x) { return x.state === "photo"; }).forEach(function (q) {
			chain = chain.then(function () {
				return idbGet("delivphotos", q.name).then(function (ph) {
					if (!ph || !ph.blob) { q.state = "done"; return idbPut("delivconfirm", q); }
					var fd = new FormData();
					fd.append("file", ph.blob, "pod-" + q.name.replace(/[^\w.-]/g, "") + ".jpg");
					fd.append("is_private", "1");
					return api("/api/method/upload_file", { method: "POST", body: fd }).then(function (up) {
						var furl = (up.message || {}).file_url;
						var setPhoto = furl
							? api("/api/method/driver_delivery_confirm", { method: "POST", json: { invoice: q.name, photo_url: furl } })
							: Promise.resolve();
						return setPhoto.then(function () {
							q.state = "done";
							return idbDel("delivphotos", q.name).then(function () { return idbPut("delivconfirm", q); });
						});
					}).catch(function (e) { if (e.auth) { needLogin(); throw e; } });
				});
			});
		});
		return chain;
	}).catch(function () { }).then(function () {
		if (MODE === "deliv" && CURVIEW === "home") renderDelivList(); else updatePend();
	});
}

function syncAll() { return Promise.all([syncNow(), syncDeliv()]); }

function updatePend() {
	Promise.all([idbAll("queue"), idbAll("delivconfirm")]).then(function (res) {
		var slips = (res[0] || []).filter(function (x) { return x.state === "queued" || x.state === "error"; }).length;
		var conf = (res[1] || []).filter(function (x) { return x.state === "queued" || x.state === "error" || x.state === "photo"; }).length;
		var n = slips + conf;
		var pb = $id("pend");
		if (pb) { pb.style.display = n ? "" : "none"; pb.textContent = n + " " + T("left"); }
	});
}

/* ---------- boot ---------- */
function boot() {
	applyLangChrome();
	checkPairFromHash();
	if (LS.vacslip_token_candidate) {
		var cand = LS.vacslip_token_candidate;
		renderLogin(T("login_ing"));
		tryPair(cand).then(function () { TOKEN = LS.vacslip_token; AUTHED = true; LS.vacslip_authed = "1"; boot(); toast(T("paired")); })
			.catch(function (e) { renderLogin(e.message); });
		return;
	}
	ensureAuth().then(function (authed) {
		if (!authed) { renderLogin(""); return; }
		MODE = LS.vacslip_mode || "deliv";
		if (MODE === "deliv") renderDeliveries(); else renderMain();
		refreshBoot(false).then(function () {
			if (MODE === "transfer") { renderFromGrid(); renderItemGrid(); }
			var b = getBoot();
			if (b) { var w = document.querySelector(".hdr .who"); if (w) w.textContent = b.driver || (AUTH && AUTH.full_name) || ""; }
		}).catch(function (e) { if (e.auth) needLogin(); });
		refreshDeliveries();
		syncAll();
	});
}

window.addEventListener("hashchange", function () {
	if ((location.hash || "").indexOf("pair=") >= 0) boot();
});
window.addEventListener("online", function () { updateNet(); syncAll(); refreshDeliveries(); });
window.addEventListener("offline", updateNet);
document.addEventListener("visibilitychange", function () { if (!document.hidden && haveAuth()) { syncAll(); refreshDeliveries(); } });

if ("serviceWorker" in navigator) {
	try { navigator.serviceWorker.register("/api/method/agriops_suite.slip.sw", { scope: "/slip" }).catch(function () { }); } catch (e) { }
}

boot();
</script>
