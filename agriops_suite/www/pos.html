<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Vijay Agro Centre — counter POS">
<meta name="vac-csrf" content="{{ csrf_token }}">
<!-- Marathi is the counter default; the app rewrites lang/title from the stored choice -->
<title>VAC POS</title>
<link rel="manifest" href="/api/method/agriops_suite.pos_pwa.manifest">
<link rel="icon" href="/assets/agriops_suite/images/pos-icon-192.png">
<link rel="apple-touch-icon" href="/assets/agriops_suite/images/pos-icon-192.png">
<style>
/* "Counter" palette (ported from the VAC POS concept): chosen neutrals biased
   toward the shop's green rather than flat grey, white cards, layered soft
   shadows, category-tinted product tiles. Green is the primary action; amber
   = udhaar/khata, teal = UPI. Variable NAMES kept stable so selectors below
   need no churn (--ivory is the page bg, --blue repurposed to UPI teal). */
:root {
	--green: #167a48;
	--green-dark: #0f5c36;
	--green-soft: #e6f2ea;
	--amber: #b45309;
	--amber-dark: #8a3f07;
	--amber-soft: #fbecd6;
	--blue: #0e7490;
	--blue-soft: #d9eef2;
	--ivory: #eaeeec;
	--card: #ffffff;
	--ink: #17211c;
	--muted: #66716b;
	--faint: #8b958f;
	--line: #e3e8e5;
	--line-2: #d7ded9;
	--soft: #f4f7f5;
	--primary: #17211c;
	--red: #b42318;
	--red-soft: #fbe6e3;
	--radius: 12px;
	--accent-green: var(--green-dark);   /* accent TEXT on soft chips (light theme = dark green) */
	--accent-amber: var(--amber-dark);
	--shadow-sm: 0 1px 2px rgba(16,40,28,.06), 0 1px 3px rgba(16,40,28,.05);
	--shadow-md: 0 6px 16px rgba(16,40,28,.09), 0 2px 6px rgba(16,40,28,.06);
	--shadow-lg: 0 18px 44px rgba(13,40,26,.16), 0 6px 18px rgba(13,40,26,.10);
	/* user-adjustable display scales (Settings → Display); JS overrides these
	   on the root element from saved prefs. 1 = default. */
	--font-scale: 1;
	--tile-scale: 1;
}
/* ---- dark theme: page/cards/lines go dark; accent hues stay vibrant; the
   *-soft chip backgrounds become dark tints and their TEXT uses the lighter
   --accent-* so it stays readable. Applied when the app sets data-theme, or
   by the OS preference when the app is on "auto". ---- */
:root[data-theme="dark"] {
	--green: #1f9455; --green-dark: #12693c;
	--green-soft: #16321f;
	--amber: #cf7a24; --amber-dark: #b45309;
	--amber-soft: #35270f;
	--blue: #2bb6d0; --blue-soft: #123640;
	--ivory: #0f1512; --card: #18211c; --soft: #222d27;
	--ink: #e8f0ea; --muted: #98a59e; --faint: #6f7c75;
	--line: #2b362f; --line-2: #3a483f;
	--primary: #e8f0ea; --red: #e5675c; --red-soft: #3a1c19;
	--accent-green: #5bd493; --accent-amber: #e6a659;
	--shadow-sm: 0 1px 2px rgba(0,0,0,.45);
	--shadow-md: 0 6px 16px rgba(0,0,0,.5);
	--shadow-lg: 0 20px 46px rgba(0,0,0,.6);
}
/* dark fix-ups: elements that used an accent as TEXT on a soft chip, or --ink
   /--primary as a dark BACKGROUND (which invert wrong when those tokens flip) */
:root[data-theme="dark"] .tile .add,
:root[data-theme="dark"] .custcard .ci,
:root[data-theme="dark"] .qbox button,
:root[data-theme="dark"] .pcard .pamt,
:root[data-theme="dark"] .ptag.cash,
:root[data-theme="dark"] .st.done,
:root[data-theme="dark"] .fjdraw button.on,
:root[data-theme="dark"] .plusone,
:root[data-theme="dark"] .rec-pill.ok,
:root[data-theme="dark"] .recseg button.on b,
:root[data-theme="dark"] .recrow:hover .rec-pr,
:root[data-theme="dark"] .splitrow.credit.zero .sl,
:root[data-theme="dark"] .splitrow.credit.zero .sv { color: var(--accent-green); }
:root[data-theme="dark"] .plusone { text-shadow: 0 1px 4px rgba(0,0,0,.6); }
:root[data-theme="dark"] .offbar,
:root[data-theme="dark"] .khata,
:root[data-theme="dark"] .holdchip,
:root[data-theme="dark"] .holdbtn,
:root[data-theme="dark"] .gohint,
:root[data-theme="dark"] .paybtns button.udh.on,
:root[data-theme="dark"] .ptag.khata,
:root[data-theme="dark"] .st.pend,
:root[data-theme="dark"] .splitrow.credit .sl,
:root[data-theme="dark"] .splitrow.credit .sv { color: var(--accent-amber); }
:root[data-theme="dark"] .chips button.on { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
:root[data-theme="dark"] .pendbadge { background: var(--green); color: #071b10; }
:root[data-theme="dark"] .tabs button.on { color: var(--ink); }
:root[data-theme="dark"] .crow:active { background: var(--soft); }
:root[data-theme="dark"] .tile:active { background: var(--soft); }
:root[data-theme="dark"] #toast { background: #313f38; color: #eef4f0; }
:root[data-theme="dark"] .pairwrap .logo,
:root[data-theme="dark"] .pairwrap .go { background: linear-gradient(150deg, var(--green), var(--green-dark)); }
:root[data-theme="dark"] .skel .sk-th, :root[data-theme="dark"] .skel .sk-l { background: linear-gradient(90deg, var(--soft) 25%, #2c3830 37%, var(--soft) 63%); background-size: 300% 100%; }
/* tile "glow": the light-mode radial tints (some hardcoded light) read as a
   harsh bright halo on a dark tile — swap for a faint category-hued glow */
:root[data-theme="dark"] .tile.c-seed .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(55,196,125,.12), transparent 74%); }
:root[data-theme="dark"] .tile.c-pest .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(217,131,52,.12), transparent 74%); }
:root[data-theme="dark"] .tile.c-fert .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(43,182,208,.12), transparent 74%); }
:root[data-theme="dark"] .tile.c-growth .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(139,92,246,.15), transparent 74%); }
:root[data-theme="dark"] .tile.c-irrig .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(59,130,246,.14), transparent 74%); }
:root[data-theme="dark"] .tile.c-hardware .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(148,163,184,.12), transparent 74%); }
:root[data-theme="dark"] .tile.c-other .thumb { background: radial-gradient(92px 62px at 50% 34%, rgba(255,255,255,.05), transparent 74%); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(17px * var(--font-scale)); }
body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
	background: var(--ivory); color: var(--ink);
	min-height: 100vh; overscroll-behavior-y: contain;
}
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; }
input, select { font: inherit; color: inherit; }
#app { max-width: 640px; margin: 0 auto; padding-bottom: 96px; }

/* --- interaction affordances ---------------------------------------------
   Every clickable element (buttons AND the onclick <div>/<span> rows) shows
   the finger cursor, resists text-selection on rapid taps, and drops the
   300ms touch delay. The overlay/sheet wrappers carry an onclick only to
   dismiss / stop-propagation, so they keep the default cursor. */
[onclick], button, .tile, .crow, .splitrow.editable, .tog { cursor: pointer; }
[onclick], button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.ovl, .sheet, .numsheet, .fjsheet { cursor: default; }
button:disabled, .gobtn:disabled, .gobtn[disabled] { cursor: not-allowed; }
/* keyboard focus ring (click/tap focus stays quiet via :focus-visible) */
button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
/* pressed feedback for the onclick rows that had none */
.cline .lr:active, .cline .qv:active, .fjrow:active, .splitrow.editable:active, .tog:active { filter: brightness(.96); }
/* inner scrollers: momentum + no scroll-chaining to the page behind */
.clist, .lines, .colR, .grid, .chips, .fjdraw { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* header */
.hdr {
	position: sticky; top: 0; z-index: 20;
	background: var(--card); color: var(--ink);
	padding: 10px 12px; display: flex; align-items: center; gap: 9px;
	border-bottom: 1px solid var(--line);
}
.hdr .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-sm); }
.hdr .ttl { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
.hdr .who { font-size: .74rem; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr .grow { flex: 1; min-width: 0; }
.netdot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex: none; }
.netdot.off { background: #f59e0b; }
.hbtn {
	min-width: 40px; height: 40px; border-radius: 10px; font-size: 1.15rem;
	background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none;
}
.hbtn:active { background: var(--line); }
.hbtn.zap { background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; box-shadow: var(--shadow-sm); }
.hbtn.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pendbadge { background: var(--primary); color: #fff; font-weight: 800; font-size: .8rem; border-radius: 999px; padding: 3px 9px; flex: none; }

.offbar {
	background: var(--amber-soft); color: var(--amber-dark);
	font-size: .86rem; font-weight: 600; text-align: center;
	padding: 7px 12px; border-bottom: 1px solid #f0ddc2;
}
.offbar.err { background: var(--red-soft); color: var(--red); border-bottom-color: #f3cfcf; }

/* tabs */
.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 12px 8px; font-weight: 700; font-size: .96rem; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--green); }
.tabs .bub { background: var(--amber); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 7px; margin-left: 5px; font-weight: 800; }

/* sell view */
.qwrap { padding: 10px 12px 4px; background: var(--card); border-bottom: 1px solid var(--line); }
.qwrap input {
	width: 100%; border: 2px solid var(--line); border-radius: 12px;
	padding: 11px 13px; font-size: 1.02rem; background: var(--card);
}
.qwrap input:focus { outline: none; border-color: var(--green); }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 9px 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
	flex: none; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card);
	padding: 7px 14px; font-size: .84rem; font-weight: 700; color: var(--muted); white-space: nowrap;
	transition: all .14s;
}
.chips button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(112px * var(--tile-scale)), 1fr)); gap: 11px; padding: 6px 12px 14px; }
/* product card: category-tinted thumb + monogram (or the real photo), name,
   price, quick-add — the concept's tile treatment */
.tile {
	background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
	overflow: hidden; text-align: left; display: flex; flex-direction: column;
	box-shadow: var(--shadow-sm); transition: transform .13s, box-shadow .13s, border-color .13s;
}
/* lift only on real pointers — on a touchscreen :hover sticks after a tap */
@media (hover: hover) {
	.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--line-2); }
	.tile:hover .add { background: var(--green); color: #fff; }
}
.tile:active { transform: translateY(0) scale(.99); border-color: var(--green); }
.tile:active .add { background: var(--green); color: #fff; }
.tile .thumb { height: calc(80px * var(--tile-scale)); position: relative; display: grid; place-items: center; }
.tile img { width: 100%; height: calc(80px * var(--tile-scale)); object-fit: contain; background: transparent; image-rendering: auto; }
.tile .mono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.13); }
.tile .tb { padding: 8px 10px 10px; border-top: 1px solid var(--line); flex: 1; display: flex; flex-direction: column; gap: 6px; }
.tile .tn { font-size: .8rem; font-weight: 600; line-height: 1.25; flex: 1;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .trow { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.tile .tp { font-size: .92rem; font-weight: 800; color: var(--ink); }
.tile .tp small { color: var(--faint); font-weight: 600; font-size: .66rem; }
.tile .add { width: 24px; height: 24px; border-radius: 7px; background: var(--green-soft); color: var(--green-dark); display: grid; place-items: center; font-weight: 800; font-size: 1rem; flex: none; transition: background .13s, color .13s; }
.tile.c-seed .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--green-soft), transparent 76%); }
.tile.c-seed .mono { background: linear-gradient(150deg, #2f9e5e, #15733f); }
.tile.c-pest .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--amber-soft), transparent 76%); }
.tile.c-pest .mono { background: linear-gradient(150deg, #d97706, #b04305); }
.tile.c-fert .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--blue-soft), transparent 76%); }
.tile.c-fert .mono { background: linear-gradient(150deg, #0e7490, #0b5563); }
.tile.c-growth .thumb { background: radial-gradient(92px 62px at 50% 32%, #efe6fb, transparent 76%); }
.tile.c-growth .mono { background: linear-gradient(150deg, #7c3aed, #5b21b6); }
.tile.c-irrig .thumb { background: radial-gradient(92px 62px at 50% 32%, #e2ecfd, transparent 76%); }
.tile.c-irrig .mono { background: linear-gradient(150deg, #2563eb, #1d4ed8); }
.tile.c-hardware .thumb { background: radial-gradient(92px 62px at 50% 32%, #eaeef2, transparent 76%); }
.tile.c-hardware .mono { background: linear-gradient(150deg, #64748b, #475569); }
.tile.c-other .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--soft), transparent 76%); }
.tile.c-other .mono { background: linear-gradient(150deg, #5b6b63, #3c4a43); }
.more { margin: 2px 12px 14px; padding: 12px; width: calc(100% - 24px); border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); font-weight: 700; }
/* loading skeleton (first catalog fetch) */
.skel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.skel .sk-th { height: 80px; }
.skel .sk-b { padding: 10px; border-top: 1px solid var(--line); }
.skel .sk-l { height: 10px; border-radius: 5px; margin-bottom: 7px; }
.skel .sk-l.short { width: 55%; margin-bottom: 0; }
.skel .sk-th, .skel .sk-l { background: linear-gradient(90deg, var(--soft) 25%, #e7ece9 37%, var(--soft) 63%); background-size: 300% 100%; animation: shimmer 1.3s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -150% 0; } }
.nores { text-align: center; color: var(--muted); padding: 34px 20px; font-size: .95rem; }

/* cart bar */
.cartbar {
	position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
	max-width: 640px; margin: 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
	background: transparent; pointer-events: none;
}
.cartbar button {
	pointer-events: auto; width: 100%; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff;
	border-radius: 12px; padding: 15px 18px; font-size: 1.08rem; font-weight: 800;
	display: flex; justify-content: space-between; align-items: center;
	box-shadow: 0 8px 22px color-mix(in srgb, var(--green-dark) 34%, transparent);
}
.cartbar button:active { transform: translateY(1px); }

/* cart view */
.sec { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px; }
.sec .sh { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.custcard { display: flex; align-items: center; gap: 10px; }
.custcard .ci { width: 42px; height: 42px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; flex: none; }
.custcard .cn { font-weight: 700; font-size: 1rem; }
.custcard .cv { font-size: .8rem; color: var(--muted); }
.custcard .grow { flex: 1; min-width: 0; }
.custcard .chg { border: 1.6px solid var(--line); color: var(--ink); border-radius: 9px; padding: 8px 13px; font-weight: 700; font-size: .88rem; flex: none; background: var(--card); }
.khata { display: inline-block; margin-top: 3px; background: var(--amber-soft); color: var(--amber-dark); font-size: .78rem; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
.cline { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cline:last-child { border-bottom: 0; }
.cline .ln { flex: 1; min-width: 0; }
.cline .lt { font-size: .92rem; font-weight: 600; line-height: 1.25; }
.cline .lr { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.cline .lr b { color: var(--ink); }
.cline .lr.editing { margin-top: 4px; }
.cline .lmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.uomchip { display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; font-size: .74rem; font-weight: 700; color: var(--green-dark); background: var(--green-soft); border-radius: 999px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
.uomchip:active { filter: brightness(.96); }
.uomchip.static { cursor: default; background: var(--soft); color: var(--muted); }
.modebar { display: flex; gap: 8px; padding: 8px 12px 0; }
.modebar button { flex: 1; border: 2px solid var(--line); border-radius: 11px; background: var(--card); padding: 9px; font-weight: 800; font-size: .92rem; color: var(--muted); }
.modebar button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.modebar.buy button.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-dark); }
.batchin { width: 100%; max-width: 130px; border: 1.6px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .78rem; margin-top: 2px; background: var(--card); color: var(--ink); }
.gobtn.buy { background: linear-gradient(150deg, var(--amber), var(--amber-dark)); }
.discchip { display: inline-flex; align-items: center; margin-top: 2px; font-size: .74rem; font-weight: 700; color: var(--amber-dark); background: var(--amber-soft); border-radius: 999px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
.discchip:active { filter: brightness(.96); }
.cline .lr.struck b { text-decoration: line-through; color: var(--muted); font-weight: 600; }
.netlbl { margin-top: 2px; font-size: .8rem; font-weight: 800; color: var(--ink); }
.discmode { display: flex; gap: 8px; margin: 6px 0 2px; }
.discmode button { flex: 1; border: 2px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px; font-weight: 800; font-size: 1rem; color: var(--muted); }
.discmode button.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-dark); }
/* inline PC editor (desktop): type the qty/rate directly, Enter commits */
.editin { width: 84px; border: 2px solid var(--green); border-radius: 8px; padding: 5px 8px; font-size: .9rem; font-weight: 800; color: var(--ink); background: var(--card); font-variant-numeric: tabular-nums; }
.editin:focus { outline: none; }
.editin.qedit { width: 52px; text-align: center; border-radius: 0; border-top: 0; border-bottom: 0; }
.qbox { display: flex; align-items: center; gap: 0; border: 1.6px solid var(--line); border-radius: 11px; overflow: hidden; flex: none; }
.qbox button { width: 40px; height: 40px; font-size: 1.25rem; font-weight: 800; color: var(--green-dark); background: var(--green-soft); }
.qbox .qv { min-width: 44px; text-align: center; font-weight: 800; font-size: 1rem; padding: 0 2px; }
.cline .amt { font-weight: 800; font-size: .95rem; min-width: 72px; text-align: right; flex: none; }
.cline .del { color: var(--red); font-size: 1.15rem; padding: 6px; flex: none; }
.totrow { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0 0; }
.totrow .tl { font-size: .95rem; font-weight: 700; color: var(--muted); }
.totrow .tv { font-size: 1.45rem; font-weight: 800; color: var(--ink); }
.paybtns { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.paybtns button { border: 2px solid var(--line); border-radius: 13px; background: var(--card); padding: 13px 6px; font-weight: 800; font-size: .98rem; color: var(--muted); }
.paybtns button.cash.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.paybtns button.upi.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.paybtns button.udh.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-dark); }
.paybtns button.spl.on { border-color: var(--green-dark); background: var(--green-dark); color: #fff; }
/* cash-drawer chooser (CASH 1 / CASH 2) */
.drawrow { display: flex; gap: 7px; margin-top: 9px; }
.drawrow .draw { flex: 1; border: 2px solid var(--line); border-radius: 11px; background: var(--card); padding: 9px 6px; font-weight: 700; font-size: .86rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
.drawrow .draw::before { content: "\1F4B5"; font-size: .95rem; }
.drawrow .draw.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.splitbox .drawrow { margin: 0; padding: 9px 13px; background: var(--soft); border-bottom: 1px solid var(--line); }
.splitbox .drawrow .draw { padding: 7px 6px; font-size: .8rem; background: var(--card); }

/* split breakdown editor */
.splitbox { margin-top: 11px; border: 1.5px solid var(--line-2); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
.splitrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 13px; border-bottom: 1px solid var(--line); background: var(--card); }
.splitrow:last-child { border-bottom: 0; }
.splitrow .sl { font-weight: 700; font-size: .95rem; display: inline-flex; align-items: center; gap: 9px; }
.splitrow .sl .ptag { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: .8rem; }
.ptag.cash { background: var(--green-soft); color: var(--green-dark); }
.ptag.upi { background: var(--blue-soft); color: var(--blue); font-size: .6rem; }
.ptag.khata { background: rgba(180,83,9,.14); color: var(--amber-dark); font-size: .72rem; }
.splitrow .sv { font-weight: 800; font-size: 1.05rem; }
.splitrow.editable:active { background: var(--soft); }
.splitrow.editable .sv::after { content: " ✎"; color: var(--muted); font-weight: 400; font-size: .8rem; }
.splitrow.credit { background: var(--amber-soft); }
.splitrow.credit .sl, .splitrow.credit .sv { color: var(--amber-dark); }
.splitrow.credit.zero { background: var(--green-soft); }
.splitrow.credit.zero .sl, .splitrow.credit.zero .sv { color: var(--green-dark); }
.splitwarn { color: var(--red); font-size: .84rem; font-weight: 700; text-align: center; padding: 8px 4px 0; }
.splithint { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 4px 0; }
.gobtn {
	width: 100%; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; border-radius: 12px;
	padding: 16px; font-size: 1.12rem; font-weight: 800; margin-top: 11px;
	box-shadow: 0 8px 20px color-mix(in srgb, var(--green-dark) 30%, transparent);
}
.gobtn:active { transform: translateY(1px); }
.gobtn:disabled { opacity: .5; box-shadow: none; }
.gobtn.udh { background: linear-gradient(150deg, var(--amber), var(--amber-dark)); box-shadow: 0 8px 20px color-mix(in srgb, var(--amber-dark) 30%, transparent); }
.backrow { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.backrow button { font-weight: 700; color: var(--ink); font-size: .95rem; padding: 6px 10px 6px 0; }

/* pending view */
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 10px 12px; padding: 12px; }
.pcard .pr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pcard .pref { font-weight: 800; font-size: .95rem; }
.pcard .pamt { font-weight: 800; font-size: 1.05rem; color: var(--green-dark); }
.pcard .pc { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.pcard .st { display: inline-block; margin-top: 7px; border-radius: 8px; font-size: .78rem; font-weight: 800; padding: 3px 9px; }
.st.pend { background: var(--amber-soft); color: var(--amber-dark); }
.st.send { background: var(--blue-soft); color: var(--blue); }
.st.fail { background: var(--red-soft); color: var(--red); }
.st.done { background: var(--green-soft); color: var(--green-dark); }
.perr { font-size: .8rem; color: var(--red); margin-top: 6px; line-height: 1.35; word-break: break-word; }
.prow { display: flex; gap: 8px; margin-top: 10px; }
.prow button { flex: 1; border: 1.6px solid var(--line); border-radius: 10px; padding: 9px; font-weight: 700; font-size: .88rem; }
.prow .rt { border-color: var(--primary); color: var(--ink); }
.prow .dd { border-color: var(--red); color: var(--red); }
.prow .pp { border-color: var(--line); color: var(--muted); }
.psec { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 14px 2px; }
.pnote { font-size: .8rem; color: var(--muted); margin: 8px 14px 20px; line-height: 1.45; }
/* recent tab */
.rechead { display: flex; align-items: center; justify-content: space-between; }
.rectitle { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 14px 2px; }
.recref { width: 40px; height: 40px; border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 1.1rem; margin: 12px 14px 0; flex: none; }
.recref:active { background: var(--line); }
/* segmented control: view one document type at a time */
.recseg { display: flex; gap: 6px; background: var(--soft); border-radius: 12px; padding: 4px; margin: 8px 12px; }
.recseg button { flex: 1; border-radius: 9px; padding: 9px 4px; font-size: .84rem; font-weight: 800; color: var(--muted); transition: all .13s; }
.recseg button b { opacity: .6; margin-left: 2px; }
.recseg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.recseg button.on b { opacity: 1; color: var(--green-dark); }
/* compact rows */
.reclist { display: flex; flex-direction: column; gap: 8px; padding: 2px 12px 22px; }
.recrow { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; box-shadow: var(--shadow-sm); }
.recrow:active { background: var(--soft); }
.rec-main { flex: 1; min-width: 0; }
.rec-ref { font-weight: 800; font-size: .9rem; display: flex; align-items: center; gap: 7px; }
.rec-time { font-weight: 700; font-size: .72rem; color: var(--muted); background: var(--soft); border-radius: 6px; padding: 1px 6px; }
.rec-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-items { font-size: .76rem; color: var(--ink); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
.recfilters { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.recfilters::-webkit-scrollbar { display: none; }
.recfilters button { flex: none; border: 1.6px solid var(--line); border-radius: 999px; background: var(--card); padding: 6px 12px; font-weight: 700; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.recfilters button b { color: var(--ink); }
.recfilters button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.invsheet { max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; overflow-y: auto; }
.invmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 2px 10px; }
.invmeta .im-cust { font-size: .95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.invtblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.invtbl { width: 100%; border-collapse: collapse; font-size: .82rem; }
.invtbl th, .invtbl td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.invtbl th { background: var(--soft); color: var(--muted); font-weight: 700; font-size: .72rem; }
.invtbl td.c, .invtbl th.c { text-align: center; }
.invtbl td.r, .invtbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.invtbl tr:last-child td { border-bottom: 0; }
.invtotals { margin-top: 12px; }
.invkv { display: flex; justify-content: space-between; padding: 6px 2px; font-size: .9rem; border-top: 1px solid var(--line); }
.invkv.grand { font-weight: 800; font-size: 1.05rem; }
.invkv.due b { color: var(--amber-dark); }
.invrem { margin-top: 10px; font-size: .82rem; color: var(--muted); font-style: italic; }
.invactions { margin-top: 14px; display: flex; gap: 8px; }
.invactions button { flex: 1; }
.repcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin: 4px 0 6px; }
.repcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow-sm); }
.repcard .rc-l { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.repcard .rc-v { font-size: 1.3rem; font-weight: 800; color: var(--ink); margin-top: 4px; font-variant-numeric: tabular-nums; }
.repcard .rc-s { font-size: .74rem; color: var(--faint); margin-top: 2px; }
.repcard.due .rc-v { color: var(--amber-dark); }
.repcard.cash { background: var(--green-soft); border-color: var(--green-soft); }
.repcard.cash .rc-v { color: var(--green-dark); }
.repsec { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 2px 8px; }
.repitbl th.sortcol { cursor: pointer; }
.repflat tbody tr { cursor: pointer; }
.repflat tbody tr:active { background: var(--soft); }
.invtbl td.nowrap { white-space: nowrap; }
.repflat .rec-pill { font-size: .66rem; padding: 1px 6px; }
.rec-r { text-align: right; flex: none; }
.rec-amt { font-weight: 800; font-size: .95rem; font-variant-numeric: tabular-nums; }
.rec-date { font-size: .72rem; color: var(--faint); margin-top: 2px; }
.rec-pr { width: 34px; height: 34px; border-radius: 9px; background: var(--soft); color: var(--muted); display: grid; place-items: center; font-size: 1rem; flex: none; }
.recrow:hover .rec-pr { background: var(--green-soft); color: var(--green-dark); }
.rec-pill { font-size: .62rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .3px; }
.rec-pill.ok { background: var(--green-soft); color: var(--green-dark); }
.rec-pill.warn { background: var(--amber-soft); color: var(--amber-dark); }
.rec-pill.due { background: var(--red-soft); color: var(--red); }
.rec-pill.muted { background: var(--soft); color: var(--muted); }
/* print-format picker */
.prlist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.prbtn { padding: 13px; border-radius: 12px; border: 1.6px solid var(--line-2); background: var(--card); font-weight: 800; font-size: .96rem; color: var(--ink); }
.prbtn:active { background: var(--soft); }

/* settings */
.setrow { margin-bottom: 12px; }
.setrow label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.setrow input { width: 100%; border: 2px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--card); }
.setrow input:focus { outline: none; border-color: var(--primary); }
.setbtn { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 13px; font-weight: 700; background: var(--card); margin-top: 9px; }
.setbtn.warn { border-color: var(--red); color: var(--red); }
.setbtn.act { border-color: var(--primary); color: var(--ink); background: var(--card); }
.togrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.togrow .tl2 { font-weight: 700; font-size: .95rem; }
.tog { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.tog.on { background: var(--green); }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.tog.on::after { left: 25px; }
.langrow2 { display: flex; gap: 8px; }
.langrow2 button { flex: 1; border: 2px solid var(--line); border-radius: 11px; padding: 10px; font-weight: 700; background: var(--card); color: var(--muted); }
.langrow2 button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 38px; height: 38px; border-radius: 11px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.2rem; font-weight: 800; display: grid; place-items: center; flex: none; }
.stepper button:active { background: var(--soft); }
.stepper button:disabled { opacity: .38; }
.steplvl { display: flex; gap: 6px; align-items: center; flex: 1; justify-content: center; }
.steplvl .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); transition: background .12s; }
.steplvl .dot.on { background: var(--green); }
.vtag { text-align: center; color: var(--muted); font-size: .75rem; margin: 18px 0 8px; }

/* customer modal */
.ovl { position: fixed; inset: 0; background: rgba(20,18,14,.5); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
.ovl.show { display: flex; }
/* stacking tiers: the FJ sheet is the base (60); the party picker opens FROM
   it so it must sit ABOVE (70); the numpad opens from either, so it is highest
   (80). Fixes the customer window appearing behind the Fast Journal form. */
#custovl { z-index: 70; }
#uomovl { z-index: 74; }
#invovl { z-index: 78; }
#discovl { z-index: 80; align-items: flex-end; }
#numovl { z-index: 80; }
.sheet {
	background: var(--ivory); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
	max-height: 86vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
}
.sheet .shh { display: flex; align-items: center; gap: 8px; padding: 13px 14px 9px; }
.sheet .shh .t { font-weight: 800; font-size: 1.02rem; flex: 1; }
.sheet .shh .x { font-size: 1.3rem; color: var(--muted); padding: 4px 8px; }
.sheet .sq { padding: 0 14px 10px; }
.sheet .sq input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; background: var(--card); }
.sheet .sq input:focus { outline: none; border-color: var(--primary); }
.clist { overflow-y: auto; flex: 1; padding: 0 10px 12px; }
.crow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 4px 8px; }
.crow:active { border-color: var(--primary); background: #fafafa; }
.crow .ci2 { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.crow .cm { flex: 1; min-width: 0; }
.crow .cn2 { font-weight: 700; font-size: .95rem; }
.crow .cd2 { font-size: .78rem; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow.on { border-color: var(--green); background: var(--green-soft); }
.crow .tick { color: var(--green-dark); font-weight: 900; flex: none; font-size: 1.05rem; }
.crow .uompr { font-weight: 800; font-size: .82rem; color: var(--green-dark); flex: none; }
.ulsep { font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 10px 8px 6px; }
.newc { margin: 2px 14px 12px; }
.newc .setbtn { margin-top: 7px; }
.newform { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 0 14px 12px; }
.newform input, .newform select { width: 100%; border: 2px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--card); color: var(--ink); margin-bottom: 9px; font: inherit; }
.newform input:focus, .newform select:focus { outline: none; border-color: var(--primary); }
.newform .nflbl { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin: 2px 2px 4px; }
.newform .nfrow { display: flex; gap: 8px; }
.newform .nfrow > div { flex: 1; min-width: 0; }

/* numeric pad (rate / qty entry — native-POS style, replaces prompt()) */
.numsheet { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
.numsheet .nt { font-weight: 800; font-size: 1rem; }
.numsheet .ns { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.numsheet .nd { text-align: right; font-size: 1.9rem; font-weight: 800; padding: 10px 8px; border-bottom: 2px solid var(--green); margin: 8px 0 12px; min-height: 2.2em; font-variant-numeric: tabular-nums; }
/* blinking caret signals the field accepts physical typing (counter PC) */
.numsheet .nd::after { content: ""; display: inline-block; width: 2px; height: 1.1em; background: var(--green); margin-left: 2px; vertical-align: -.12em; animation: caret 1.05s step-end infinite; }
@keyframes caret { 50% { opacity: 0; } }
.numsheet .nhint { font-size: .74rem; color: var(--faint); text-align: right; margin: -6px 2px 10px; }
.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.numpad button { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 15px 0; font-size: 1.25rem; font-weight: 700; }
.numpad button:active { background: var(--soft); }
.numpad .nfn { background: var(--soft); }
.numpad .nok { grid-row: span 2; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; border-color: transparent; font-size: 1.5rem; }
.numpad .nok:active { transform: translateY(1px); }

/* in-app confirm sheet (replaces browser confirm()) */
#askovl { z-index: 90; align-items: center; }
.askbox { background: var(--card); border-radius: 18px; width: 100%; max-width: 340px; padding: 20px 18px 16px; box-shadow: var(--shadow-lg); }
.askbox .askt { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
.askbox .askm { color: var(--muted); font-size: .93rem; line-height: 1.45; margin-bottom: 17px; }
.askrow { display: flex; gap: 9px; }
.askrow button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 800; font-size: .96rem; }
.askrow .askno { border: 1.6px solid var(--line-2); background: var(--card); color: var(--ink); }
.askrow .askyes { background: var(--green-dark); color: #fff; }
.askrow .askyes.danger { background: var(--red); }

/* held bills (parked mid-conversation; amber = someone waiting) */
.holdstrip { display: flex; gap: 7px; overflow-x: auto; padding: 9px 12px 0; scrollbar-width: none; }
.holdstrip::-webkit-scrollbar { display: none; }
.holdchip { flex: none; display: flex; align-items: center; gap: 4px; background: var(--amber-soft); border: 1.6px solid var(--amber); color: var(--amber-dark); border-radius: 12px; padding: 7px 5px 7px 11px; font-size: .85rem; font-weight: 700; }
.holdchip .hb { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
.holdchip .ha { font-weight: 600; font-size: .72rem; opacity: .75; }
.holdchip .hx { padding: 3px 8px; font-size: .95rem; border-radius: 8px; }
.holdchip .hx:active { background: rgba(0,0,0,.08); }
.holdbtn { width: 100%; border: 2px solid var(--amber); color: var(--amber-dark); background: var(--card); border-radius: 12px; padding: 13px; font-weight: 800; margin-top: 9px; }
.holdbtn:active { background: var(--amber-soft); }
/* why the confirm button can't fire yet */
.gohint { text-align: center; font-size: .8rem; font-weight: 600; color: var(--amber-dark); margin-top: 7px; }
/* floating "+1" when a tile is tapped */
.plusone { position: fixed; z-index: 95; transform: translate(-50%, -50%); color: var(--green-dark); font-weight: 800; font-size: 1.3rem; pointer-events: none; text-shadow: 0 1px 3px rgba(255,255,255,.9); animation: flyup .7s ease-out forwards; }
@keyframes flyup { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 18% { opacity: 1; transform: translate(-50%, -70%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -175%) scale(1); } }
@media (prefers-reduced-motion: reduce) { .plusone, .skel .sk-th, .skel .sk-l, .numsheet .nd::after, .live { animation: none !important; } }

/* fast journal (receive payment) sheet */
.fjsheet { padding: 0 14px 14px; }
.fjtypes { display: flex; gap: 6px; background: var(--soft); border-radius: 12px; padding: 4px; margin-top: 10px; }
.fjtypes button { flex: 1; border-radius: 9px; padding: 9px 4px; font-size: .82rem; font-weight: 800; color: var(--muted); background: transparent; transition: all .13s; }
.fjtypes button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.fjlbl { font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin: 12px 2px 0; }
.fjrow { display: flex; align-items: center; gap: 9px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-top: 9px; }
.fjrow:active { border-color: var(--green); }
.fjrow .fl { font-size: .78rem; font-weight: 700; color: var(--muted); flex: none; }
.fjrow .fv { flex: 1; text-align: right; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fjdraw { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.fjdraw button { border: 1.6px solid var(--line-2); border-radius: 10px; background: var(--card); padding: 9px 12px; font-size: .84rem; font-weight: 700; color: var(--muted); }
.fjdraw button.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
.fjsheet input.fr { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; background: var(--card); margin-top: 9px; }

/* login */
.pairwrap { padding: 44px 26px; text-align: center; }
.pairwrap .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--primary); color: #fff; font-size: 2.5rem; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.pairwrap h1 { font-size: 1.35rem; margin-bottom: 6px; }
.pairwrap p { color: var(--muted); font-size: .92rem; margin-bottom: 20px; line-height: 1.5; }
.pairwrap input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 13px 14px; background: var(--card); margin-bottom: 10px; font-size: 1rem; }
.pairwrap input:focus { outline: none; border-color: var(--primary); }
.pairwrap .go { width: 100%; background: var(--primary); color: #fff; border-radius: 12px; padding: 14px; font-size: 1.05rem; font-weight: 800; margin-top: 4px; }
.pairwrap .go:disabled { opacity: .6; }
.pairerr { color: var(--red); font-size: .88rem; margin-top: 12px; min-height: 1.2em; }
.langrow { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
.langrow button { border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: .9rem; font-weight: 700; background: var(--card); color: var(--muted); }
.langrow button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }

/* desktop / counter PC: native-POS two-pane split (items left, bill right) */
@media (min-width: 1000px) {
	html { font-size: calc(15px * var(--font-scale)); }
	/* fill the counter monitor edge-to-edge (no centred gutter); the bill panel
	   stays a fixed 420px on the right, the item grid takes the rest */
	#app { max-width: none; padding-bottom: 24px; }
	.cartbar { display: none; }
	.cols { display: grid; grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
	.colR { position: sticky; top: 63px; max-height: calc(100vh - 67px); min-height: calc(100vh - 67px); overflow-y: auto; border-left: 1px solid var(--line); background: var(--card); }
	.cols .backrow { display: none; }
	.grid { grid-template-columns: repeat(auto-fill, minmax(calc(126px * var(--tile-scale)), 1fr)); gap: 10px; }
	.ovl { align-items: center; }
	.sheet { border-radius: 16px; max-height: 82vh; max-width: 560px; }
	.numsheet { border-radius: 16px; max-width: 400px; }
}

/* toast */
#toast {
	position: fixed; bottom: 106px; left: 50%; transform: translateX(-50%) translateY(20px);
	background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 18px;
	font-size: .92rem; font-weight: 600; opacity: 0; pointer-events: none;
	transition: all .22s ease; z-index: 90; max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* receipt print */
#receipt { display: none; }
@media print {
	@page { margin: 3mm; }
	body { background: #fff; }
	#wrap, #toast { display: none !important; }
	#receipt { display: block !important; width: 72mm; font-family: "Segoe UI", "Noto Sans Devanagari", monospace; font-size: 11.5px; line-height: 1.4; color: #000; }
	#receipt .rc { text-align: center; }
	#receipt .rb { font-weight: 800; }
	#receipt .rh1 { font-size: 15px; font-weight: 800; }
	#receipt hr { border: 0; border-top: 1px dashed #000; margin: 5px 0; }
	#receipt table { width: 100%; border-collapse: collapse; }
	#receipt td { padding: 1.5px 0; vertical-align: top; }
	#receipt .tr { text-align: right; white-space: nowrap; }
	#receipt .tot td { font-size: 13.5px; font-weight: 800; padding-top: 4px; }
	#receipt .sm { font-size: 10px; }
}
</style>
</head>

/* ---------- display scales (Settings → Display) ----------
   Item tile size and text size, each a discrete level applied as a multiplier
   on the CSS --tile-scale / --font-scale vars. Persisted in S, set on the root
   so it survives every render. Bigger tiles also enlarge the image area, which
   shows more of the (512px) product photos — sharper, not just bigger. */
var TILE_STEPS = [0.8, 1.0, 1.2, 1.45, 1.7];
var FONT_STEPS = [0.9, 1.0, 1.12, 1.26, 1.42];
function scaleIdx(v, arr) { v = (v == null) ? 1 : v; return Math.max(0, Math.min(arr.length - 1, v)); }
function applyScale() {
	var r = document.documentElement;
	r.style.setProperty("--tile-scale", String(TILE_STEPS[scaleIdx(S.tileStep, TILE_STEPS)]));
	r.style.setProperty("--font-scale", String(FONT_STEPS[scaleIdx(S.fontStep, FONT_STEPS)]));
}
function bumpScale(which, d) {
	var isTile = which === "tile";
	var key = isTile ? "tileStep" : "fontStep", arr = isTile ? TILE_STEPS : FONT_STEPS;
	S[key] = scaleIdx((S[key] == null ? 1 : S[key]) + d, arr);
	saveS(); applyScale(); render();
}
applyScale();  /* apply immediately, before first paint */

/* ---------- IndexedDB (kv + outbox queue) ---------- */
var _db = null, _dbFailed = false, STORAGE_OK = true;
function db() {
	return new Promise(function (res, rej) {
		if (_db) { res(_db); return; }
		if (_dbFailed) { rej(new Error("idb unavailable")); return; }
		var settled = false;
		function fail(why) { if (settled) return; settled = true; _dbFailed = true; STORAGE_OK = false; rej(new Error(why)); }
		var r;
		try { r = indexedDB.open("vacpos", 1); }
		catch (e) { fail("open threw"); return; }
		r.onupgradeneeded = function () {
			var d = r.result;
			if (!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", { keyPath: "uid" });
			if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
		};
		r.onsuccess = function () { if (settled) return; settled = true; _db = r.result; res(_db); };
		r.onerror = function () { fail("open error"); };
		r.onblocked = function () { fail("open blocked"); };
		setTimeout(function () { fail("open timed out"); }, 5000);
	});
}
function idbQPut(v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("queue", "readwrite"); t.objectStore("queue").put(v); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbQDel(k) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("queue", "readwrite"); t.objectStore("queue").delete(k); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbQAll() { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction("queue").objectStore("queue").getAll(); q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbKGet(k) { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbKPut(k, v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }

/* ---------- api (device token OR session cookie + CSRF) ---------- */
function api(path, opts) {
	opts = opts || {};
	var headers = {};
	if (TOKEN) headers["Authorization"] = "token " + TOKEN;
	else if (CSRF) headers["X-Frappe-CSRF-Token"] = CSRF;
	var body;
	if (opts.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(opts.json); }
	return fetch(path, {
		method: opts.method || "GET",
		headers: headers,
		body: body,
		credentials: "same-origin"
	}).catch(function () {
		throw { net: true, message: T("syncfail") };
	}).then(function (res) {
		if (res.status === 401 || res.status === 403) throw { auth: true, message: T("login_bad") };
		return res.text().then(function (text) {
			var data = {};
			try { data = JSON.parse(text); } catch (e) { }
			if (!res.ok) {
				var m = data.exception || ("HTTP " + res.status);
				if (data._server_messages) {
					try { m = JSON.parse(JSON.parse(data._server_messages)[0]).message || m; } catch (e) { }
				}
				/* an absent Server Script surfaces as 417 "Failed to get method",
				   not 404 (verified against prod 2026-07-24) — both mean
				   "endpoints not installed on this site" */
				var absent = res.status === 404 ||
					(res.status === 417 && String(m).indexOf("Failed to get method") !== -1);
				throw { notfound: absent, message: String(m).replace(/<[^>]*>/g, "").slice(0, 220) };
			}
			return data;
		});
	});
}

/* ---------- price write-back (UOM-aware) ----------
   Prices are per (item, UOM): a bag rate is not a per-Kg rate. PRICES[code] is a
   map { "": stockUnitRate, "Kg": rate, "Bag": rate, ... } where "" is the plain
   (uom-less) Item Price row that ERPNext treats as the stock-unit price. The
   stock unit writes back to "" ; any other unit gets its own UOM-specific row.
   Fill an empty price silently; changing a saved one asks first. */
function ppList() { return (PROFILE && PROFILE.selling_price_list) || "Standard Selling"; }
/* stored key for a unit = its real UOM (ERPNext auto-fills uom=stock_uom for the
   default Item Price row, so the "stock price" lives under the stock unit, not a
   blank key) */
function saveUomKey(code, uom) {
	var it = findItem(code), su = it && it.stock_uom;
	return uom || su || "";
}
/* price to show/charge for this unit — an exact per-UOM price wins; older data
   may have a blank-uom row, kept as a fallback for the stock unit only */
function priceFor(code, uom) {
	var m = PRICES[code]; if (!m) return null;
	var it = findItem(code), su = it && it.stock_uom, key = uom || su;
	if (key && m[key] != null) return m[key];
	if ((!uom || uom === su) && m[""] != null) return m[""];   /* legacy blank-uom row */
	return null;
}
function setPrice(code, uom, rate, quiet) {
	rate = round2(rate);
	var key = saveUomKey(code, uom);
	return api("/api/method/vac_pos_set_price", { method: "POST", json: { item_code: code, uom: key, rate: rate, price_list: ppList() } })
		.then(function (d) {
			var m = (d && d.message) || {};
			if (!PRICES[code]) PRICES[code] = {};
			PRICES[code][key] = rate;
			if (!quiet && (m.action === "created" || m.action === "updated")) toast(T("price_saved"));
			return m;
		})
		.catch(function () { /* offline / no perm / non-priceable unit — line rate still applies */ });
}
function priceWriteback(code, name, uom, rate) {
	if (!code) return;
	rate = round2(rate);
	if (!(rate > 0)) return;
	/* ERPNext only allows an Item Price for a UOM defined on the item. A relabel
	   unit (picked from the global list, not defined on the item) can't be priced
	   — the line rate still applies, we just don't try to save it to the list. */
	var defs = itemUomDefs(code), u = uom || defs.stock;
	if (u && !defs.seen[u]) return;
	var cur = priceFor(code, uom);
	if (cur == null) { setPrice(code, uom, rate, true); return; }    /* fill the gap for this unit */
	if (Math.abs(round2(cur) - rate) < 0.005) return;               /* unchanged */
	var sfx = u ? (" /" + u) : "";
	askConfirm({
		title: name + (u ? " · " + u : ""),
		msg: T("price_upd_q").replace("{old}", fmt(cur) + sfx).replace("{new}", fmt(rate) + sfx),
		yes: T("price_upd_yes"),
		onYes: function () { setPrice(code, uom, rate); }
	});
}

/* ---------- catalog ---------- */
var CATALOG = null, ITEMS = [], PRICES = {}, CUSTOMERS = [], PROFILE = {}, CATS = [];
function adoptCatalog(c) {
	CATALOG = c || null;
	ITEMS = (c && c.items) || [];
	CUSTOMERS = (c && c.customers) || [];
	PROFILE = (c && c.profile) || {};
	PRICES = {};
	var pr = (c && c.prices) || [];
	/* nested by UOM: PRICES[code][uom] = rate ("" = the uom-less / stock-unit row) */
	for (var i = 0; i < pr.length; i++) {
		var row = pr[i], pc = row.item_code, pu = row.uom || "";
		if (!PRICES[pc]) PRICES[pc] = {};
		PRICES[pc][pu] = row.price_list_rate;
	}
	/* which high-level categories actually have items, in CATDEFS order */
	var present = {};
	for (var j = 0; j < ITEMS.length; j++) present[groupCategory(ITEMS[j].item_group)] = true;
	CATS = CATDEFS.filter(function (d) { return present[d.key]; });
	/* pick the default cash drawer whenever a fresh catalog lands */
	cashMode = defaultCashMode();
}
function walkinName() { return PROFILE.customer || "Cash Customer"; }
var CAT_TTL = 6 * 60 * 60 * 1000;
function refreshCatalog(force) {
	if (!force && CATALOG && CATALOG.ts && (Date.now() - CATALOG.ts < CAT_TTL)) return Promise.resolve(false);
	if (!navigator.onLine) return Promise.resolve(false);
	return api("/api/method/vac_pos_catalog?profile=" + encodeURIComponent(S.profile)).then(function (data) {
		var m = data.message || {};
		m.ts = Date.now();
		adoptCatalog(m);
		idbKPut("catalog", m).catch(function () { });
		return true;
	});
}

   has a chip (fertilizers were invisible before — 5 small groups, none top-8). */

	if (/insectic|pestic|herbic|fungic|weedic|acaric|rodentic|nematic|plant protection/.test(g)) return "pest";
	if (/biostim|growth regulat|\bpgr\b|tonic|hormone/.test(g)) return "growth";
	if (/irrigat|drip|sprink|spray|\bpipe|pump|nozzle|hose/.test(g)) return "irrig";

/* Enter with exactly one match adds it and clears the box — USB barcode
   scanners (keyboard wedge) type the code then send Enter, so a scan
   becomes one cart line with zero extra taps */
function qKey(e) {
	if (e.key !== "Enter") return;
	var m = matchItems();
	if (m.length === 1) { addItem(m[0].name); searchQ = ""; render(); }
}
function setGroup(g) { groupF = g; gridCap = 60; render(); }
function moreTiles() { gridCap += 60; render(); }
function renderSellGridOnly() {
	/* update ONLY the results wrapper — never the focused #q input, or the mobile
	   soft keyboard closes on every keystroke (input element gets replaced) */
	var g = $id("gridwrap");
	if (g) g.innerHTML = sellGridHtml();
	else render();
}
function findItem(code) {
	for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].name === code) return ITEMS[i];
	return null;
}
/* floating "+1" at the tap point — confirms the add survived the grid re-render */
function flashPlusOne(ev) {
	if (!ev || ev.clientX == null) return;
	var el = document.createElement("div");
	el.className = "plusone"; el.textContent = "+1";
	el.style.left = ev.clientX + "px"; el.style.top = ev.clientY + "px";
	document.body.appendChild(el);
	setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
}
function addItem(code, ev) {
	var it = findItem(code);
	if (!it) return;
	flashPlusOne(ev);
	if (MODE === "buy") { pAdd(it); return; }   /* Buy mode: goes to the purchase cart */
	for (var i = 0; i < cart.length; i++) {
		if (cart[i].code === code) { cart[i].qty += 1; render(); return; }
	}
	var su = it.stock_uom || "";
	var rate = priceFor(code, su);
	if (rate == null) {
		/* no selling price for this unit: numpad asks the rate, then fill-gaps it
		   into the price list for this unit (see priceWriteback) */
		openNum(it.item_name, T("rate_p"), "", function (r) {
			cart.push({ code: code, name: it.item_name, uom: su, conv: 1, qty: 1, rate: r });
			render();
			priceWriteback(code, it.item_name, su, r);
		});
		return;
	}
	cart.push({ code: code, name: it.item_name, uom: su, conv: 1, qty: 1, rate: rate });
	render();
}

/* ---------- cart ---------- */
function renderCart() {
	if (MODE === "buy") return renderBuyCart();
	var h = '<div class="backrow"><button onclick="go(\'sell\')">&larr; ' + esc(T("sell")) + "</button></div>";
	var cd = CUST || { customer_name: walkinName(), name: walkinName(), _walkin: true };
	h += '<div class="sec"><div class="sh">' + esc(T("cust")) + "</div>" +
		'<div class="custcard"><div class="ci">' + initials(cd.customer_name) + "</div>" +
		'<div class="grow"><div class="cn">' + esc(cd.customer_name) + "</div>" +
		'<div class="cv">' + esc(cd.custom_village || cd.mobile_no || (cd._walkin ? T("walkin") : "")) + "</div>" +
		(KHATA != null && !cd._walkin ? '<span class="khata">' + esc(T("khata")) + " " + fmt(KHATA) + "</span>" : "") +
		"</div>" +
		'<button class="chg" onclick="openCust()">' + esc(T("change")) + "</button></div></div>";

	h += '<div class="sec">';
	if (!cart.length) h += '<div class="nores">' + esc(T("empty")) + "</div>";
	else {
		var tot = 0;
		for (var i = 0; i < cart.length; i++) {
			var l = cart[i]; var net = lineNet(l); var amt = round2(l.qty * net); tot += amt;
			var discOn = !!(l.dpct || l.damt);
			var edR = EDIT && EDIT.i === i && EDIT.field === "rate";
			var edQ = EDIT && EDIT.i === i && EDIT.field === "qty";
			var rateCell = edR
				? '<div class="lr editing"><input id="editin" class="editin" type="text" inputmode="decimal" value="' + esc(String(l.rate)) + '" onblur="commitEdit(this.value)" onkeydown="editKey(event)"></div>'
				: '<div class="lr' + (discOn ? " struck" : "") + '" onclick="editRate(' + i + ')"><b>' + fmt(l.rate) + "</b> &#9998;</div>";
			var uomCell = '<span class="uomchip" onclick="editUom(' + i + ')">' + esc(l.uom || T("uom_p")) + " &#9662;</span>";
			var discCell = '<span class="discchip' + (discOn ? " on" : "") + '" onclick="editDisc(' + i + ')">' +
				(discOn ? "&minus;" + (l.dpct ? qtyfmt(l.dpct) + "%" : fmt(l.damt)) : esc(T("disc"))) + "</span>";
			var netCell = discOn ? '<span class="netlbl">= ' + fmt(net) + "</span>" : "";
			var qvCell = edQ
				? '<input id="editin" class="editin qedit" type="text" inputmode="decimal" value="' + esc(qtyfmt(l.qty)) + '" onblur="commitEdit(this.value)" onkeydown="editKey(event)">'
				: '<div class="qv" onclick="editQty(' + i + ')">' + qtyfmt(l.qty) + "</div>";
			h += '<div class="cline">' +
				'<div class="ln"><div class="lt">' + esc(l.name) + '</div><div class="lmeta">' + rateCell + uomCell + discCell + netCell + "</div></div>" +
				'<div class="qbox"><button aria-label="minus one" onclick="qDown(' + i + ')">&minus;</button>' +
				qvCell +
				'<button aria-label="plus one" onclick="qUp(' + i + ')">+</button></div>' +
				'<div class="amt">' + fmt(amt) + "</div>" +
				'<button class="del" onclick="delLine(' + i + ')">&#10005;</button></div>';
		}
		h += '<div class="totrow"><div class="tl">' + esc(T("to_cart")) + "</div><div class=\"tv\">" + fmt(round2(tot)) + "</div></div>";
	}
	h += "</div>";

	h += renderPaySection();
	return h;
}
/* payment section: three one-tap modes + Split (part cash / part UPI / rest
   on khata). Split amounts are fixed rupees the cashier types; the credit row
   is the live remainder and is what lands as the invoice's outstanding. */
function renderPaySection() {
	var h = '<div class="sec"><div class="sh">' + esc(T("cash")) + " / UPI / " + esc(T("udhaar")) + " / " + esc(T("split")) + "</div>" +
		'<div class="paybtns">' +
		'<button class="cash ' + (payMode === "Cash" ? "on" : "") + '" onclick="setPay(\'Cash\')">' + esc(T("cash")) + "</button>" +
		'<button class="upi ' + (payMode === "UPI" ? "on" : "") + '" onclick="setPay(\'UPI\')">' + esc(T("upi")) + "</button>" +
		'<button class="udh ' + (payMode === "Udhaar" ? "on" : "") + '" onclick="setPay(\'Udhaar\')">' + esc(T("udhaar")) + "</button>" +
		'<button class="spl ' + (payMode === "Split" ? "on" : "") + '" onclick="setPay(\'Split\')">' + esc(T("split")) + "</button>" +
		"</div>";
	/* full-cash sale: pick which drawer it lands in */
	if (payMode === "Cash") h += drawerToggle();
	var blocked = false;
	if (payMode === "Split") {
		var credit = splitCredit();
		var over = credit < -0.005;
		h += '<div class="splitbox">' +
			'<div class="splitrow editable" onclick="splitEdit(\'cash\')"><span class="sl"><span class="ptag cash">&#8377;</span>' + esc(T("cash")) + '</span><span class="sv">' + fmt(split.cash || 0) + "</span></div>" +
			((split.cash || 0) > 0.005 ? drawerToggle() : "") +
			'<div class="splitrow editable" onclick="splitEdit(\'upi\')"><span class="sl"><span class="ptag upi">&#9654;</span>' + esc(T("upi")) + '</span><span class="sv">' + fmt(split.upi || 0) + "</span></div>" +
			'<div class="splitrow credit ' + (credit <= 0.005 ? "zero" : "") + '"><span class="sl"><span class="ptag khata">&#9776;</span>' + esc(T("khata_bal")) + '</span><span class="sv">' + fmt(Math.max(0, credit)) + "</span></div>" +
			"</div>";
		if (over) { h += '<div class="splitwarn">' + esc(T("overpaid")) + "</div>"; blocked = true; }
		else h += '<div class="splithint">' + esc(T("split_hint")) + "</div>";
	}
	var udh = (payMode === "Udhaar") || (payMode === "Split" && splitCredit() > 0.005);
	var needCust = udh && !CUST;
	h += '<button class="gobtn' + (udh ? " udh" : "") + '" id="gobtn" onclick="checkout()"' + (cart.length && !BUSY && !blocked ? "" : " disabled") + ">" +
		esc(T("confirm")) + (cart.length ? " — " + fmt(cartTotal()) : "") + "</button>";
	/* say WHY the sale can't complete yet, instead of a silently dead button */
	var hint = !cart.length ? T("hint_items") : blocked ? T("overpaid") : needCust ? T("need_cust") : "";
	if (hint) h += '<div class="gohint">' + esc(hint) + "</div>";
	h += (cart.length ? '<button class="holdbtn" onclick="holdBill()">&#9208; ' + esc(T("hold")) + "</button>" : "") +
		"</div>";
	return h;
}
/* per-line discount: l.rate is the LIST price; the discount is either a percent
   (l.dpct) or a rupee amount per unit (l.damt). Net = list - discount. */
function lineDiscUnit(l) { return round2(l.dpct ? (l.rate || 0) * l.dpct / 100 : (l.damt || 0)); }
function lineNet(l) { return Math.max(0, round2((l.rate || 0) - lineDiscUnit(l))); }
function cartTotal() { var t = 0; for (var i = 0; i < cart.length; i++) t += cart[i].qty * lineNet(cart[i]); return round2(t); }
function splitCredit() { return round2(cartTotal() - (split.cash || 0) - (split.upi || 0)); }
function splitEdit(field) {
	openNum(field === "cash" ? T("cash") : T("upi"), T("split"), split[field] || "", function (v) {
		split[field] = round2(v); render();
	}, true);
}
function setPay(m) {
	payMode = m; render();
	/* Udhaar needs a real customer up front; Split only if a credit remainder
	   survives to checkout, so it does not nag when the split fully pays */
	if (m === "Udhaar" && !CUST) { toast(T("need_cust")); openCust(); }
}
function qUp(i) { cart[i].qty += 1; render(); }
function qDown(i) { cart[i].qty -= 1; if (cart[i].qty <= 0) cart.splice(i, 1); render(); }
function delLine(i) { cart.splice(i, 1); render(); }
/* On the counter PC, editing qty/rate happens INLINE (click → focused input,
   type, Enter) — no modal. Touch devices keep the numpad sheet. */
var EDIT = null;
function editQty(i) {
	if (isWide()) { EDIT = { i: i, field: "qty" }; render(); focusEdit(); }
	else openNum(cart[i].name, T("qty_p"), qtyfmt(cart[i].qty), function (q) { cart[i].qty = q; render(); });
}
function editRate(i) {
	if (isWide()) { EDIT = { i: i, field: "rate" }; render(); focusEdit(); }
	else openNum(cart[i].name, T("rate_p"), String(cart[i].rate), function (r) { cart[i].rate = r; render(); priceWriteback(cart[i].code, cart[i].name, cart[i].uom, r); });
}
function focusEdit() { setTimeout(function () { var el = $id("editin"); if (el) { el.focus(); el.select(); } }, 0); }
function editKey(e) { if (e.key === "Enter") { e.preventDefault(); commitEdit(e.target.value); } else if (e.key === "Escape") { e.preventDefault(); EDIT = null; render(); } }
function commitEdit(val) {
	if (!EDIT) return;
	var v = parseFloat(String(val).replace(/[^\d.]/g, ""));
	var e = EDIT; EDIT = null;
	if (v > 0 && cart[e.i]) {
		cart[e.i][e.field] = e.field === "rate" ? round2(v) : v;
		if (e.field === "rate") priceWriteback(cart[e.i].code, cart[e.i].name, cart[e.i].uom, cart[e.i].rate);
	}
	render();
}

/* ---------- unit (UOM) picker ----------
   A cart line may be billed in any existing UOM master. Where the owner has
   defined a real conversion on the item, its factor is used; otherwise it is a
   factor-1 relabel (1 chosen unit = 1 stock unit — a rename, not a split).
   Nothing on the item master changes — the choice lives only on this line. */
var UOMI = null, uomQ = "";
function itemUomDefs(code) {
	var it = findItem(code) || {}, out = [], seen = {};
	(it.uoms || []).forEach(function (u) {
		if (u && u.uom && !seen[u.uom]) { seen[u.uom] = 1; out.push({ uom: u.uom, factor: Number(u.conversion_factor) || 1 }); }
	});
	var su = it.stock_uom || "";
	if (su && !seen[su]) { seen[su] = 1; out.unshift({ uom: su, factor: 1 }); }
	return { defined: out, seen: seen, stock: su };
}
function editUom(i) {
	if (!cart[i]) return;
	UOMI = i; uomQ = "";
	renderUomSheet();
	$id("uomovl").classList.add("show");
	var q = $id("uq"); if (q) q.focus();
}
function closeUom() { UOMI = null; var o = $id("uomovl"); if (o) o.classList.remove("show"); }
function uomOptions() {
	if (UOMI == null || !cart[UOMI]) return { defined: [], others: [], stock: "" };
	var defs = itemUomDefs(cart[UOMI].code), q = norm(uomQ);
	var defined = defs.defined.filter(function (o) { return !q || norm(o.uom).indexOf(q) !== -1; });
	var all = (CATALOG && CATALOG.uoms) || [], others = [];
	for (var i = 0; i < all.length; i++) {
		var u = all[i];
		if (defs.seen[u]) continue;
		if (q && norm(u).indexOf(q) === -1) continue;
		others.push({ uom: u, factor: 1 });
		if (others.length >= 60) break;
	}
	return { defined: defined, others: others, stock: defs.stock };
}
function uomRow(o, cur, stock) {
	var on = o.uom === cur;
	var sub = (o.factor === 1)
		? (o.uom === stock ? T("uom_stock") : "1 " + o.uom + " = 1 " + stock)
		: ("1 " + o.uom + " = " + qtyfmt(o.factor) + " " + stock);
	/* show this unit's own saved price, if any (prices differ per unit) */
	var code = (UOMI != null && cart[UOMI]) ? cart[UOMI].code : null;
	var p = code ? priceFor(code, o.uom) : null;
	var pr = (p != null) ? '<div class="uompr">' + fmt(p) + "</div>" : "";
	return '<div class="crow' + (on ? " on" : "") + '" onclick="pickUom(' + esc(JSON.stringify(o.uom)) + ',' + o.factor + ')">' +
		'<div class="ci2">' + esc((o.uom || "?").slice(0, 2).toUpperCase()) + "</div>" +
		'<div class="cm"><div class="cn2">' + esc(o.uom) + '</div><div class="cd2">' + esc(sub) + "</div></div>" +
		pr + (on ? '<div class="tick">&#10003;</div>' : "") + "</div>";
}
function uomListHtml() {
	if (UOMI == null || !cart[UOMI]) return "";
	var l = cart[UOMI], o = uomOptions(), cur = l.uom || o.stock, h = "";
	o.defined.forEach(function (d) { h += uomRow(d, cur, o.stock); });
	if (o.others.length) {
		h += '<div class="ulsep">' + esc(T("uom_other")) + "</div>";
		o.others.forEach(function (d) { h += uomRow(d, cur, o.stock); });
	}
	if (!o.defined.length && !o.others.length) h += '<div class="nores">' + esc(T("no_match")) + "</div>";
	return h;
}
function renderUomSheet() {
	if (UOMI == null || !cart[UOMI]) return;
	var l = cart[UOMI];
	$id("uomovl").innerHTML =
		'<div class="sheet" onclick="event.stopPropagation()">' +
		'<div class="shh"><div class="t">' + esc(T("uom_pick")) + " — " + esc(l.name) + '</div><button class="x" aria-label="Close" onclick="closeUom()">&#10005;</button></div>' +
		'<div class="sq"><input id="uq" placeholder="' + esc(T("search_ph")) + '" value="' + esc(uomQ) + '" oninput="onUQ(this.value)"></div>' +
		'<div class="clist" id="ulist">' + uomListHtml() + "</div></div>";
}
function onUQ(v) { uomQ = v; var el = $id("ulist"); if (el) el.innerHTML = uomListHtml(); }
function pickUom(uom, factor) {
	if (UOMI == null || !cart[UOMI]) { closeUom(); return; }
	var l = cart[UOMI];
	l.uom = uom;
	l.conv = Number(factor) || 1;
	/* prices change per unit: switch the line rate to this unit's saved price if
	   there is one (else keep the current rate — editing it fill-gaps this unit) */
	var p = priceFor(l.code, uom);
	if (p != null) l.rate = round2(p);
	closeUom();
	render();
}

/* ---------- numeric pad sheet ---------- */
var NUM = null;
function openNum(title, sub, initial, cb, allowZero) {
	var pre = initial == null ? "" : String(initial);
	/* pristine: a prefilled value (editing an existing rate/qty) is "typed over"
	   — the first digit clears it, so editing 800 and typing 125 gives 125, not
	   800125. Backspace/clear still edit the existing value in place. */
	NUM = { title: title, sub: sub, val: pre, cb: cb, allowZero: !!allowZero, pristine: pre !== "" };
	/* drop focus from whatever was behind (search box, etc.) so keystrokes go to
	   the pad and, on a phone, the OS keyboard closes */
	if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
	renderNum();
	$id("numovl").classList.add("show");
}
function closeNum() { NUM = null; var o = $id("numovl"); if (o) o.classList.remove("show"); }

/* ---------- in-app confirm (replaces the browser confirm() dialog) ----------
   opts: { title?, msg, yes?, no?, danger?, onYes } — styled like the rest of
   the app, translated, and it never blocks the thread. */
var ASK = null;
function askConfirm(o) { ASK = o; renderAsk(); $id("askovl").classList.add("show"); }
function closeAsk() { ASK = null; var el = $id("askovl"); if (el) el.classList.remove("show"); }
function askYes() { var fn = ASK && ASK.onYes; closeAsk(); if (fn) fn(); }
function renderAsk() {
	if (!ASK) return;
	$id("askovl").innerHTML =
		'<div class="askbox" onclick="event.stopPropagation()">' +
		(ASK.title ? '<div class="askt">' + esc(ASK.title) + "</div>" : "") +
		'<div class="askm">' + esc(ASK.msg) + "</div>" +
		'<div class="askrow">' +
		'<button class="askno" onclick="closeAsk()">' + esc(ASK.no || T("btn_cancel")) + "</button>" +
		'<button class="askyes' + (ASK.danger ? " danger" : "") + '" onclick="askYes()">' + esc(ASK.yes || T("btn_ok")) + "</button>" +
		"</div></div>";
}
function renderNum() {
	if (!NUM) return;
	var keys =
		'<button onclick="numKey(\'7\')">7</button><button onclick="numKey(\'8\')">8</button><button onclick="numKey(\'9\')">9</button><button class="nfn" onclick="numKey(\'b\')">&#9003;</button>' +
		'<button onclick="numKey(\'4\')">4</button><button onclick="numKey(\'5\')">5</button><button onclick="numKey(\'6\')">6</button><button class="nfn" onclick="numKey(\'c\')">C</button>' +
		'<button onclick="numKey(\'1\')">1</button><button onclick="numKey(\'2\')">2</button><button onclick="numKey(\'3\')">3</button><button class="nok" onclick="numOk()">&#10003;</button>' +
		'<button onclick="numKey(\'.\')">.</button><button onclick="numKey(\'0\')">0</button><button onclick="numKey(\'0\');numKey(\'0\')">00</button>';
	$id("numovl").innerHTML =
		'<div class="numsheet" onclick="event.stopPropagation()">' +
		'<div class="nt">' + esc(NUM.title) + "</div>" +
		(NUM.sub ? '<div class="ns">' + esc(NUM.sub) + "</div>" : "") +
		'<div class="nd">' + esc(NUM.val || "0") + "</div>" +
		'<div class="nhint">' + esc(T("num_hint")) + "</div>" +
		'<div class="numpad">' + keys + "</div></div>";
}
function numKey(k) {
	if (!NUM) return;
	/* first digit/decimal on a prefilled value starts fresh (type-over) */
	if (NUM.pristine && (k === "." || (k >= "0" && k <= "9"))) NUM.val = "";
	NUM.pristine = false;
	if (k === "b") NUM.val = NUM.val.slice(0, -1);
	else if (k === "c") NUM.val = "";
	else if (k === ".") { if (NUM.val.indexOf(".") === -1) NUM.val = (NUM.val || "0") + "."; }
	else { NUM.val = (NUM.val === "0" ? "" : NUM.val) + k; }
	if (NUM.val.length > 9) NUM.val = NUM.val.slice(0, 9);
	renderNum();
}
function numOk() {
	if (!NUM) return;
	var v = parseFloat(NUM.val);
	if (isNaN(v)) v = 0;
	/* allowZero: split fields may be cleared to 0; elsewhere a positive number is required */
	if (v < 0 || (!NUM.allowZero && !(v > 0))) { toast(T("bad_num")); return; }
	var cb = NUM.cb;
	closeNum();
	cb(v);
}

/* ---------- per-line discount sheet (% or ₹ off the list price) ---------- */
var DISC = null;
function editDisc(i) {
	var l = cart[i]; if (!l) return;
	DISC = { i: i, mode: l.damt ? "amt" : "pct", val: String(l.dpct || l.damt || ""), pristine: true };
	if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
	renderDisc();
	$id("discovl").classList.add("show");
}
function closeDisc() { DISC = null; var o = $id("discovl"); if (o) o.classList.remove("show"); }
function discMode(m) { if (!DISC) return; DISC.mode = m; DISC.val = ""; DISC.pristine = false; renderDisc(); }
function discKey(k) {
	if (!DISC) return;
	if (DISC.pristine && (k === "." || (k >= "0" && k <= "9"))) DISC.val = "";
	DISC.pristine = false;
	if (k === "b") DISC.val = DISC.val.slice(0, -1);
	else if (k === "c") DISC.val = "";
	else if (k === ".") { if (DISC.val.indexOf(".") === -1) DISC.val = (DISC.val || "0") + "."; }
	else { DISC.val = (DISC.val === "0" ? "" : DISC.val) + k; }
	if (DISC.val.length > 7) DISC.val = DISC.val.slice(0, 7);
	renderDisc();
}
function discNet() {
	var l = cart[DISC.i]; if (!l) return 0;
	var v = parseFloat(DISC.val) || 0, list = l.rate || 0;
	var per = DISC.mode === "pct" ? list * v / 100 : v;
	return Math.max(0, round2(list - per));
}
function discOk() {
	if (!DISC) return;
	var l = cart[DISC.i]; if (!l) { closeDisc(); return; }
	var v = parseFloat(DISC.val); if (isNaN(v)) v = 0;
	if (v < 0) { toast(T("bad_num")); return; }
	if (DISC.mode === "pct") {
		if (v > 100) { toast(T("bad_num")); return; }
		l.dpct = v > 0 ? round2(v) : 0; l.damt = 0;
	} else {
		if (v > (l.rate || 0)) { toast(T("disc_big")); return; }
		l.damt = v > 0 ? round2(v) : 0; l.dpct = 0;
	}
	closeDisc(); render();
}
function discClear() { if (!DISC) return; var l = cart[DISC.i]; if (l) { l.dpct = 0; l.damt = 0; } closeDisc(); render(); }
function renderDisc() {
	if (!DISC) return;
	var l = cart[DISC.i]; if (!l) return;
	var keys =
		'<button onclick="discKey(\'7\')">7</button><button onclick="discKey(\'8\')">8</button><button onclick="discKey(\'9\')">9</button><button class="nfn" onclick="discKey(\'b\')">&#9003;</button>' +
