<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Vijay Agro Centre — counter POS">
<meta name="vac-csrf" content="{{ csrf_token }}">
<!-- Marathi is the counter default; the app rewrites lang/title from the stored choice -->
<title>VAC POS</title>
<link rel="manifest" href="/api/method/agriops_suite.pos_pwa.manifest">
<link rel="icon" href="/assets/agriops_suite/images/pos-icon-192.png">
<link rel="apple-touch-icon" href="/assets/agriops_suite/images/pos-icon-192.png">
<style>
/* "Counter" palette (ported from the VAC POS concept): chosen neutrals biased
   toward the shop's green rather than flat grey, white cards, layered soft
   shadows, category-tinted product tiles. Green is the primary action; amber
   = udhaar/khata, teal = UPI. Variable NAMES kept stable so selectors below
   need no churn (--ivory is the page bg, --blue repurposed to UPI teal). */
:root {
	--green: #167a48;
	--green-dark: #0f5c36;
	--green-soft: #e6f2ea;
	--amber: #b45309;
	--amber-dark: #8a3f07;
	--amber-soft: #fbecd6;
	--blue: #0e7490;
	--blue-soft: #d9eef2;
	--ivory: #eaeeec;
	--card: #ffffff;
	--ink: #17211c;
	--muted: #66716b;
	--faint: #8b958f;
	--line: #e3e8e5;
	--line-2: #d7ded9;
	--soft: #f4f7f5;
	--primary: #17211c;
	--red: #b42318;
	--red-soft: #fbe6e3;
	--radius: 12px;
	--shadow-sm: 0 1px 2px rgba(16,40,28,.06), 0 1px 3px rgba(16,40,28,.05);
	--shadow-md: 0 6px 16px rgba(16,40,28,.09), 0 2px 6px rgba(16,40,28,.06);
	--shadow-lg: 0 18px 44px rgba(13,40,26,.16), 0 6px 18px rgba(13,40,26,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 17px; }
body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
	background: var(--ivory); color: var(--ink);
	min-height: 100vh; overscroll-behavior-y: contain;
}
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; }
input, select { font: inherit; color: inherit; }
#app { max-width: 640px; margin: 0 auto; padding-bottom: 96px; }

/* header */
.hdr {
	position: sticky; top: 0; z-index: 20;
	background: var(--card); color: var(--ink);
	padding: 10px 12px; display: flex; align-items: center; gap: 9px;
	border-bottom: 1px solid var(--line);
}
.hdr .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-sm); }
.hdr .ttl { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
.hdr .who { font-size: .74rem; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr .grow { flex: 1; min-width: 0; }
.netdot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex: none; }
.netdot.off { background: #f59e0b; }
.hbtn {
	min-width: 40px; height: 40px; border-radius: 10px; font-size: 1.15rem;
	background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none;
}
.hbtn:active { background: var(--line); }
.hbtn.zap { background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; box-shadow: var(--shadow-sm); }
.hbtn.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pendbadge { background: var(--primary); color: #fff; font-weight: 800; font-size: .8rem; border-radius: 999px; padding: 3px 9px; flex: none; }

.offbar {
	background: var(--amber-soft); color: var(--amber-dark);
	font-size: .86rem; font-weight: 600; text-align: center;
	padding: 7px 12px; border-bottom: 1px solid #f0ddc2;
}
.offbar.err { background: var(--red-soft); color: var(--red); border-bottom-color: #f3cfcf; }

/* tabs */
.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 12px 8px; font-weight: 700; font-size: .96rem; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--green); }
.tabs .bub { background: var(--amber); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 7px; margin-left: 5px; font-weight: 800; }

/* sell view */
.qwrap { padding: 10px 12px 4px; background: var(--card); border-bottom: 1px solid var(--line); }
.qwrap input {
	width: 100%; border: 2px solid var(--line); border-radius: 12px;
	padding: 11px 13px; font-size: 1.02rem; background: #fff;
}
.qwrap input:focus { outline: none; border-color: var(--green); }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 9px 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
	flex: none; border: 1.5px solid var(--line); border-radius: 999px; background: #fff;
	padding: 7px 14px; font-size: .84rem; font-weight: 700; color: var(--muted); white-space: nowrap;
	transition: all .14s;
}
.chips button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 11px; padding: 6px 12px 14px; }
/* product card: category-tinted thumb + monogram (or the real photo), name,
   price, quick-add — the concept's tile treatment */
.tile {
	background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
	overflow: hidden; text-align: left; display: flex; flex-direction: column;
	box-shadow: var(--shadow-sm); transition: transform .13s, box-shadow .13s, border-color .13s;
}
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--line-2); }
.tile:active { transform: translateY(0) scale(.99); }
.tile .thumb { height: 80px; position: relative; display: grid; place-items: center; }
.tile img { width: 100%; height: 80px; object-fit: contain; background: transparent; }
.tile .mono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.13); }
.tile .tb { padding: 8px 10px 10px; border-top: 1px solid var(--line); flex: 1; display: flex; flex-direction: column; gap: 6px; }
.tile .tn { font-size: .8rem; font-weight: 600; line-height: 1.25; flex: 1;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .trow { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.tile .tp { font-size: .92rem; font-weight: 800; color: var(--ink); }
.tile .tp small { color: var(--faint); font-weight: 600; font-size: .66rem; }
.tile .add { width: 24px; height: 24px; border-radius: 7px; background: var(--green-soft); color: var(--green-dark); display: grid; place-items: center; font-weight: 800; font-size: 1rem; flex: none; transition: background .13s, color .13s; }
.tile:hover .add { background: var(--green); color: #fff; }
.tile.c-seed .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--green-soft), transparent 76%); }
.tile.c-seed .mono { background: linear-gradient(150deg, #2f9e5e, #15733f); }
.tile.c-pest .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--amber-soft), transparent 76%); }
.tile.c-pest .mono { background: linear-gradient(150deg, #d97706, #b04305); }
.tile.c-fert .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--blue-soft), transparent 76%); }
.tile.c-fert .mono { background: linear-gradient(150deg, #0e7490, #0b5563); }
.tile.c-other .thumb { background: radial-gradient(92px 62px at 50% 32%, var(--soft), transparent 76%); }
.tile.c-other .mono { background: linear-gradient(150deg, #5b6b63, #3c4a43); }
.more { margin: 2px 12px 14px; padding: 12px; width: calc(100% - 24px); border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); font-weight: 700; }
.nores { text-align: center; color: var(--muted); padding: 34px 20px; font-size: .95rem; }

/* cart bar */
.cartbar {
	position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
	max-width: 640px; margin: 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
	background: transparent; pointer-events: none;
}
.cartbar button {
	pointer-events: auto; width: 100%; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff;
	border-radius: 12px; padding: 15px 18px; font-size: 1.08rem; font-weight: 800;
	display: flex; justify-content: space-between; align-items: center;
	box-shadow: 0 8px 22px color-mix(in srgb, var(--green-dark) 34%, transparent);
}
.cartbar button:active { transform: translateY(1px); }

/* cart view */
.sec { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px; }
.sec .sh { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.custcard { display: flex; align-items: center; gap: 10px; }
.custcard .ci { width: 42px; height: 42px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; flex: none; }
.custcard .cn { font-weight: 700; font-size: 1rem; }
.custcard .cv { font-size: .8rem; color: var(--muted); }
.custcard .grow { flex: 1; min-width: 0; }
.custcard .chg { border: 1.6px solid var(--line); color: var(--ink); border-radius: 9px; padding: 8px 13px; font-weight: 700; font-size: .88rem; flex: none; background: #fff; }
.khata { display: inline-block; margin-top: 3px; background: var(--amber-soft); color: var(--amber-dark); font-size: .78rem; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
.cline { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cline:last-child { border-bottom: 0; }
.cline .ln { flex: 1; min-width: 0; }
.cline .lt { font-size: .92rem; font-weight: 600; line-height: 1.25; }
.cline .lr { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.cline .lr b { color: var(--ink); }
.qbox { display: flex; align-items: center; gap: 0; border: 1.6px solid var(--line); border-radius: 11px; overflow: hidden; flex: none; }
.qbox button { width: 40px; height: 40px; font-size: 1.25rem; font-weight: 800; color: var(--green-dark); background: var(--green-soft); }
.qbox .qv { min-width: 44px; text-align: center; font-weight: 800; font-size: 1rem; padding: 0 2px; }
.cline .amt { font-weight: 800; font-size: .95rem; min-width: 72px; text-align: right; flex: none; }
.cline .del { color: var(--red); font-size: 1.15rem; padding: 6px; flex: none; }
.totrow { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0 0; }
.totrow .tl { font-size: .95rem; font-weight: 700; color: var(--muted); }
.totrow .tv { font-size: 1.45rem; font-weight: 800; color: var(--ink); }
.paybtns { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.paybtns button { border: 2px solid var(--line); border-radius: 13px; background: #fff; padding: 13px 6px; font-weight: 800; font-size: .98rem; color: var(--muted); }
.paybtns button.cash.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.paybtns button.upi.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.paybtns button.udh.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-dark); }
.paybtns button.spl.on { border-color: var(--green-dark); background: var(--green-dark); color: #fff; }

/* split breakdown editor */
.splitbox { margin-top: 11px; border: 1.5px solid var(--line-2); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
.splitrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 13px; border-bottom: 1px solid var(--line); background: #fff; }
.splitrow:last-child { border-bottom: 0; }
.splitrow .sl { font-weight: 700; font-size: .95rem; display: inline-flex; align-items: center; gap: 9px; }
.splitrow .sl .ptag { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: .8rem; }
.ptag.cash { background: var(--green-soft); color: var(--green-dark); }
.ptag.upi { background: var(--blue-soft); color: var(--blue); font-size: .6rem; }
.ptag.khata { background: rgba(180,83,9,.14); color: var(--amber-dark); font-size: .72rem; }
.splitrow .sv { font-weight: 800; font-size: 1.05rem; }
.splitrow.editable:active { background: var(--soft); }
.splitrow.editable .sv::after { content: " ✎"; color: var(--muted); font-weight: 400; font-size: .8rem; }
.splitrow.credit { background: var(--amber-soft); }
.splitrow.credit .sl, .splitrow.credit .sv { color: var(--amber-dark); }
.splitrow.credit.zero { background: var(--green-soft); }
.splitrow.credit.zero .sl, .splitrow.credit.zero .sv { color: var(--green-dark); }
.splitwarn { color: var(--red); font-size: .84rem; font-weight: 700; text-align: center; padding: 8px 4px 0; }
.splithint { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 4px 0; }
.gobtn {
	width: 100%; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; border-radius: 12px;
	padding: 16px; font-size: 1.12rem; font-weight: 800; margin-top: 11px;
	box-shadow: 0 8px 20px color-mix(in srgb, var(--green-dark) 30%, transparent);
}
.gobtn:active { transform: translateY(1px); }
.gobtn:disabled { opacity: .5; box-shadow: none; }
.gobtn.udh { background: linear-gradient(150deg, var(--amber), var(--amber-dark)); box-shadow: 0 8px 20px color-mix(in srgb, var(--amber-dark) 30%, transparent); }
.backrow { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.backrow button { font-weight: 700; color: var(--ink); font-size: .95rem; padding: 6px 10px 6px 0; }

/* pending view */
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 10px 12px; padding: 12px; }
.pcard .pr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pcard .pref { font-weight: 800; font-size: .95rem; }
.pcard .pamt { font-weight: 800; font-size: 1.05rem; color: var(--green-dark); }
.pcard .pc { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.pcard .st { display: inline-block; margin-top: 7px; border-radius: 8px; font-size: .78rem; font-weight: 800; padding: 3px 9px; }
.st.pend { background: var(--amber-soft); color: var(--amber-dark); }
.st.send { background: var(--blue-soft); color: var(--blue); }
.st.fail { background: var(--red-soft); color: var(--red); }
.st.done { background: var(--green-soft); color: var(--green-dark); }
.perr { font-size: .8rem; color: var(--red); margin-top: 6px; line-height: 1.35; word-break: break-word; }
.prow { display: flex; gap: 8px; margin-top: 10px; }
.prow button { flex: 1; border: 1.6px solid var(--line); border-radius: 10px; padding: 9px; font-weight: 700; font-size: .88rem; }
.prow .rt { border-color: var(--primary); color: var(--ink); }
.prow .dd { border-color: var(--red); color: var(--red); }
.prow .pp { border-color: var(--line); color: var(--muted); }
.psec { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 14px 2px; }
.pnote { font-size: .8rem; color: var(--muted); margin: 8px 14px 20px; line-height: 1.45; }

/* settings */
.setrow { margin-bottom: 12px; }
.setrow label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.setrow input { width: 100%; border: 2px solid var(--line); border-radius: 11px; padding: 10px 12px; background: #fff; }
.setrow input:focus { outline: none; border-color: var(--primary); }
.setbtn { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 13px; font-weight: 700; background: #fff; margin-top: 9px; }
.setbtn.warn { border-color: var(--red); color: var(--red); }
.setbtn.act { border-color: var(--primary); color: var(--ink); background: #fff; }
.togrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.togrow .tl2 { font-weight: 700; font-size: .95rem; }
.tog { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.tog.on { background: var(--green); }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.tog.on::after { left: 25px; }
.langrow2 { display: flex; gap: 8px; }
.langrow2 button { flex: 1; border: 2px solid var(--line); border-radius: 11px; padding: 10px; font-weight: 700; background: #fff; color: var(--muted); }
.langrow2 button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }
.vtag { text-align: center; color: var(--muted); font-size: .75rem; margin: 18px 0 8px; }

/* customer modal */
.ovl { position: fixed; inset: 0; background: rgba(20,18,14,.5); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
.ovl.show { display: flex; }
/* stacking tiers: the FJ sheet is the base (60); the party picker opens FROM
   it so it must sit ABOVE (70); the numpad opens from either, so it is highest
   (80). Fixes the customer window appearing behind the Fast Journal form. */
#custovl { z-index: 70; }
#numovl { z-index: 80; }
.sheet {
	background: var(--ivory); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
	max-height: 86vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
}
.sheet .shh { display: flex; align-items: center; gap: 8px; padding: 13px 14px 9px; }
.sheet .shh .t { font-weight: 800; font-size: 1.02rem; flex: 1; }
.sheet .shh .x { font-size: 1.3rem; color: var(--muted); padding: 4px 8px; }
.sheet .sq { padding: 0 14px 10px; }
.sheet .sq input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; background: #fff; }
.sheet .sq input:focus { outline: none; border-color: var(--primary); }
.clist { overflow-y: auto; flex: 1; padding: 0 10px 12px; }
.crow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 4px 8px; }
.crow:active { border-color: var(--primary); background: #fafafa; }
.crow .ci2 { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.crow .cm { flex: 1; min-width: 0; }
.crow .cn2 { font-weight: 700; font-size: .95rem; }
.crow .cd2 { font-size: .78rem; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.newc { margin: 2px 14px 12px; }
.newc .setbtn { margin-top: 7px; }
.newform { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 0 14px 12px; }
.newform input { width: 100%; border: 2px solid var(--line); border-radius: 11px; padding: 10px 12px; background: #fff; margin-bottom: 9px; }
.newform input:focus { outline: none; border-color: var(--primary); }

/* numeric pad (rate / qty entry — native-POS style, replaces prompt()) */
.numsheet { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
.numsheet .nt { font-weight: 800; font-size: 1rem; }
.numsheet .ns { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.numsheet .nd { text-align: right; font-size: 1.9rem; font-weight: 800; padding: 10px 8px; border-bottom: 2px solid var(--line); margin: 8px 0 12px; min-height: 2.2em; }
.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.numpad button { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 15px 0; font-size: 1.25rem; font-weight: 700; }
.numpad button:active { background: var(--soft); }
.numpad .nfn { background: var(--soft); }
.numpad .nok { grid-row: span 2; background: linear-gradient(150deg, var(--green), var(--green-dark)); color: #fff; border-color: transparent; font-size: 1.5rem; }
.numpad .nok:active { transform: translateY(1px); }

/* held bills (parked mid-conversation; amber = someone waiting) */
.holdstrip { display: flex; gap: 7px; overflow-x: auto; padding: 9px 12px 0; scrollbar-width: none; }
.holdstrip::-webkit-scrollbar { display: none; }
.holdchip { flex: none; display: flex; align-items: center; gap: 4px; background: var(--amber-soft); border: 1.6px solid var(--amber); color: var(--amber-dark); border-radius: 12px; padding: 7px 5px 7px 11px; font-size: .85rem; font-weight: 700; }
.holdchip .hb { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
.holdchip .ha { font-weight: 600; font-size: .72rem; opacity: .75; }
.holdchip .hx { padding: 3px 8px; font-size: .95rem; border-radius: 8px; }
.holdchip .hx:active { background: rgba(0,0,0,.08); }
.holdbtn { width: 100%; border: 2px solid var(--amber); color: var(--amber-dark); background: #fff; border-radius: 12px; padding: 13px; font-weight: 800; margin-top: 9px; }
.holdbtn:active { background: var(--amber-soft); }

/* fast journal (receive payment) sheet */
.fjsheet { padding: 0 14px 14px; }
.fjtypes { display: flex; gap: 6px; background: var(--soft); border-radius: 12px; padding: 4px; margin-top: 10px; }
.fjtypes button { flex: 1; border-radius: 9px; padding: 9px 4px; font-size: .82rem; font-weight: 800; color: var(--muted); background: transparent; transition: all .13s; }
.fjtypes button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.fjlbl { font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin: 12px 2px 0; }
.fjrow { display: flex; align-items: center; gap: 9px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-top: 9px; }
.fjrow:active { border-color: var(--green); }
.fjrow .fl { font-size: .78rem; font-weight: 700; color: var(--muted); flex: none; }
.fjrow .fv { flex: 1; text-align: right; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fjdraw { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.fjdraw button { border: 1.6px solid var(--line-2); border-radius: 10px; background: #fff; padding: 9px 12px; font-size: .84rem; font-weight: 700; color: var(--muted); }
.fjdraw button.on { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
.fjsheet input.fr { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; background: #fff; margin-top: 9px; }

/* login */
.pairwrap { padding: 44px 26px; text-align: center; }
.pairwrap .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--primary); color: #fff; font-size: 2.5rem; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.pairwrap h1 { font-size: 1.35rem; margin-bottom: 6px; }
.pairwrap p { color: var(--muted); font-size: .92rem; margin-bottom: 20px; line-height: 1.5; }
.pairwrap input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fff; margin-bottom: 10px; font-size: 1rem; }
.pairwrap input:focus { outline: none; border-color: var(--primary); }
.pairwrap .go { width: 100%; background: var(--primary); color: #fff; border-radius: 12px; padding: 14px; font-size: 1.05rem; font-weight: 800; margin-top: 4px; }
.pairwrap .go:disabled { opacity: .6; }
.pairerr { color: var(--red); font-size: .88rem; margin-top: 12px; min-height: 1.2em; }
.langrow { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
.langrow button { border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: .9rem; font-weight: 700; background: #fff; color: var(--muted); }
.langrow button.on { border-color: var(--primary); background: var(--soft); color: var(--ink); }

/* desktop / counter PC: native-POS two-pane split (items left, bill right) */
@media (min-width: 1000px) {
	html { font-size: 15px; }
	#app { max-width: 1320px; padding-bottom: 24px; }
	.cartbar { display: none; }
	.cols { display: grid; grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
	.colR { position: sticky; top: 63px; max-height: calc(100vh - 67px); min-height: calc(100vh - 67px); overflow-y: auto; border-left: 1px solid var(--line); background: var(--card); }
	.cols .backrow { display: none; }
	.grid { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 10px; }
	.ovl { align-items: center; }
	.sheet { border-radius: 16px; max-height: 82vh; max-width: 560px; }
	.numsheet { border-radius: 16px; max-width: 400px; }
}

/* toast */
#toast {
	position: fixed; bottom: 106px; left: 50%; transform: translateX(-50%) translateY(20px);
	background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 18px;
	font-size: .92rem; font-weight: 600; opacity: 0; pointer-events: none;
	transition: all .22s ease; z-index: 90; max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* receipt print */
#receipt { display: none; }
@media print {
	@page { margin: 3mm; }
	body { background: #fff; }
	#wrap, #toast { display: none !important; }
	#receipt { display: block !important; width: 72mm; font-family: "Segoe UI", "Noto Sans Devanagari", monospace; font-size: 11.5px; line-height: 1.4; color: #000; }
	#receipt .rc { text-align: center; }
	#receipt .rb { font-weight: 800; }
	#receipt .rh1 { font-size: 15px; font-weight: 800; }
	#receipt hr { border: 0; border-top: 1px dashed #000; margin: 5px 0; }
	#receipt table { width: 100%; border-collapse: collapse; }
	#receipt td { padding: 1.5px 0; vertical-align: top; }
	#receipt .tr { text-align: right; white-space: nowrap; }
	#receipt .tot td { font-size: 13.5px; font-weight: 800; padding-top: 4px; }
	#receipt .sm { font-size: 10px; }
}
</style>
</head>

/* ---------- IndexedDB (kv + outbox queue) ---------- */
var _db = null, _dbFailed = false, STORAGE_OK = true;
function db() {
	return new Promise(function (res, rej) {
		if (_db) { res(_db); return; }
		if (_dbFailed) { rej(new Error("idb unavailable")); return; }
		var settled = false;
		function fail(why) { if (settled) return; settled = true; _dbFailed = true; STORAGE_OK = false; rej(new Error(why)); }
		var r;
		try { r = indexedDB.open("vacpos", 1); }
		catch (e) { fail("open threw"); return; }
		r.onupgradeneeded = function () {
			var d = r.result;
			if (!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", { keyPath: "uid" });
			if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
		};
		r.onsuccess = function () { if (settled) return; settled = true; _db = r.result; res(_db); };
		r.onerror = function () { fail("open error"); };
		r.onblocked = function () { fail("open blocked"); };
		setTimeout(function () { fail("open timed out"); }, 5000);
	});
}
function idbQPut(v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("queue", "readwrite"); t.objectStore("queue").put(v); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbQDel(k) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("queue", "readwrite"); t.objectStore("queue").delete(k); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }
function idbQAll() { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction("queue").objectStore("queue").getAll(); q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbKGet(k) { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbKPut(k, v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; }); }); }

/* ---------- api (device token OR session cookie + CSRF) ---------- */
function api(path, opts) {
	opts = opts || {};
	var headers = {};
	if (TOKEN) headers["Authorization"] = "token " + TOKEN;
	else if (CSRF) headers["X-Frappe-CSRF-Token"] = CSRF;
	var body;
	if (opts.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(opts.json); }
	return fetch(path, {
		method: opts.method || "GET",
		headers: headers,
		body: body,
		credentials: "same-origin"
	}).catch(function () {
		throw { net: true, message: T("syncfail") };
	}).then(function (res) {
		if (res.status === 401 || res.status === 403) throw { auth: true, message: T("login_bad") };
		return res.text().then(function (text) {
			var data = {};
			try { data = JSON.parse(text); } catch (e) { }
			if (!res.ok) {
				var m = data.exception || ("HTTP " + res.status);
				if (data._server_messages) {
					try { m = JSON.parse(JSON.parse(data._server_messages)[0]).message || m; } catch (e) { }
				}
				/* an absent Server Script surfaces as 417 "Failed to get method",
				   not 404 (verified against prod 2026-07-24) — both mean
				   "endpoints not installed on this site" */
				var absent = res.status === 404 ||
					(res.status === 417 && String(m).indexOf("Failed to get method") !== -1);
				throw { notfound: absent, message: String(m).replace(/<[^>]*>/g, "").slice(0, 220) };
			}
			return data;
		});
	});
}

			'<div class="splitrow editable" onclick="splitEdit(\'cash\')"><span class="sl"><span class="ptag cash">&#8377;</span>' + esc(T("cash")) + '</span><span class="sv">' + fmt(split.cash || 0) + "</span></div>" +
			'<div class="splitrow editable" onclick="splitEdit(\'upi\')"><span class="sl"><span class="ptag upi">&#9654;</span>' + esc(T("upi")) + '</span><span class="sv">' + fmt(split.upi || 0) + "</span></div>" +
			'<div class="splitrow credit ' + (credit <= 0.005 ? "zero" : "") + '"><span class="sl"><span class="ptag khata">&#9776;</span>' + esc(T("khata_bal")) + '</span><span class="sv">' + fmt(Math.max(0, credit)) + "</span></div>" +
			"</div>";
		if (over) { h += '<div class="splitwarn">' + esc(T("overpaid")) + "</div>"; blocked = true; }
		else h += '<div class="splithint">' + esc(T("split_hint")) + "</div>";
	}
	var udh = (payMode === "Udhaar") || (payMode === "Split" && splitCredit() > 0.005);
	h += '<button class="gobtn' + (udh ? " udh" : "") + '" id="gobtn" onclick="checkout()"' + (cart.length && !BUSY && !blocked ? "" : " disabled") + ">" +
		esc(T("confirm")) + (cart.length ? " — " + fmt(cartTotal()) : "") + "</button>" +
		(cart.length ? '<button class="holdbtn" onclick="holdBill()">&#9208; ' + esc(T("hold")) + "</button>" : "") +
		"</div>";
	return h;
}
function cartTotal() { var t = 0; for (var i = 0; i < cart.length; i++) t += cart[i].qty * cart[i].rate; return round2(t); }
function splitCredit() { return round2(cartTotal() - (split.cash || 0) - (split.upi || 0)); }
function splitEdit(field) {
	openNum(field === "cash" ? T("cash") : T("upi"), T("split"), split[field] || "", function (v) {

}
function setPay(m) {

	   survives to checkout, so it does not nag when the split fully pays */
	if (m === "Udhaar" && !CUST) { toast(T("need_cust")); openCust(); }
}
function qUp(i) { cart[i].qty += 1; render(); }
function qDown(i) { cart[i].qty -= 1; if (cart[i].qty <= 0) cart.splice(i, 1); render(); }
function delLine(i) { cart.splice(i, 1); render(); }

/* ---------- checkout ----------
   Builds the payment rows + the credit (khata) remainder from the chosen
   mode. The server posts whatever payments we send and leaves the rest as
   outstanding, so a Split with a remainder becomes a "Partly Paid" invoice
   (verified on staging: cash+upi rows, credit = outstanding). */
function checkout() {
	if (!cart.length || BUSY) return;
	var total = cartTotal();
	var pays, credit;
	if (payMode === "Udhaar") { pays = []; credit = total; }
	else if (payMode === "Split") {
		credit = splitCredit();
		if (credit < -0.005) { toast(T("overpaid")); return; }
		pays = [];
		if ((split.cash || 0) > 0.005) pays.push({ mode_of_payment: "Cash", amount: round2(split.cash) });
		if ((split.upi || 0) > 0.005) pays.push({ mode_of_payment: "UPI", amount: round2(split.upi) });
		if (credit < 0.005) credit = 0;
		if (!pays.length) { payMode = "Udhaar"; }  /* nothing entered -> plain udhaar */
	} else { pays = [{ mode_of_payment: payMode, amount: total }]; credit = 0; }
	/* any credit portion accrues receivable -> must be a named customer */
	if (credit > 0.005 && !CUST) { toast(T("need_cust")); openCust(); return; }
	BUSY = true; render();
	var sale = {
		uid: uidNew(),
		ref: nextRef(),
		ts: nowStamp(),
		date: today(),
		customer: CUST ? CUST.name : walkinName(),
		customer_name: CUST ? CUST.customer_name : walkinName(),
		mode: pays.length && credit > 0.005 ? "Split" : (pays.length ? payMode : "Udhaar"),
		total: total,
		credit: round2(credit),
		items: cart.map(function (l) { return { item_code: l.code, item_name: l.name, uom: l.uom, qty: l.qty, rate: l.rate }; }),
		payments: pays,
		status: "pending", err: "", result: null
	};
	queue.push(sale);
	idbQPut(sale).catch(function () { toast("storage!"); });
	cart = []; CUST = null; KHATA = null; payMode = "Cash"; split = { cash: 0, upi: 0 }; BUSY = false; VIEW = "sell";
	render();
	toast(T("queued") + " " + sale.ref);
	if (S.autoprint) printSale(sale);
	syncNow(false);
}

/* ---------- sync ---------- */
function syncNow(manual) {
	if (SYNCING || !navigator.onLine || DISABLED) return;
	var work = [];
	for (var i = 0; i < queue.length; i++) {
		if (queue[i].status === "pending" || (manual && queue[i].status === "failed")) work.push(queue[i]);
	}
	if (!work.length) return;
	SYNCING = true;
	var sb = $id("syncbtn"); if (sb) sb.classList.add("spin");
	var idx = 0;
	function fin() {
		SYNCING = false;
		var sb2 = $id("syncbtn"); if (sb2) sb2.classList.remove("spin");
		render();
	}
	function step() {
		if (idx >= work.length) { fin(); return; }
		var sale = work[idx];
		sale.status = "sending"; sale.err = "";
		if (VIEW === "pending") render();
		api("/api/method/vac_pos_create_invoice", {
			method: "POST",
			json: {
				pwa_client_id: sale.uid,
				pos_profile: S.profile,
				customer: sale.customer,
				items: sale.items.map(function (l) { return { item_code: l.item_code, qty: l.qty, rate: l.rate }; }),
				payments: sale.payments,
				posting_date: sale.date,
				remarks: "POS PWA " + sale.ref
			}
		}).then(function (d) {
			var m = d.message || {};
			sale.status = "done"; sale.result = m;
			done.unshift(sale); saveDone();
			for (var k = 0; k < queue.length; k++) if (queue[k].uid === sale.uid) { queue.splice(k, 1); break; }
			idbQDel(sale.uid).catch(function () { });
			toast(T("billno") + " " + (m.name || ""));
			idx += 1; step();
		}).catch(function (e) {
			if (e && e.auth) { sale.status = "pending"; idbQPut(sale).catch(function () { }); fin(); needLogin(); return; }
			if (e && e.net) { sale.status = "pending"; idbQPut(sale).catch(function () { }); fin(); return; }
			if (e && e.notfound) { sale.status = "pending"; idbQPut(sale).catch(function () { }); fin(); disabledCheck(); return; }
			sale.status = "failed"; sale.err = (e && e.message) || "?";
			idbQPut(sale).catch(function () { });
			idx += 1; step();
		});
	}
	step();
}

function retrySale(uid) {

/* ---------- receipt ---------- */

/* ---------- customer picker ---------- */
var custQ = "", showNew = false, CUSTMODE = "cart";
function openCust(mode) {
	CUSTMODE = mode === "fj" ? "fj" : "cart";
	custQ = ""; showNew = false;
	renderCustSheet();
	$id("custovl").classList.add("show");
	var q = $id("cq"); if (q) q.focus();
}
function closeCust() { var o = $id("custovl"); if (o) o.classList.remove("show"); }
/* which party list the sheet is picking from. In cart mode it is always the
   Customer list; in FJ mode it follows the FJ voucher type (receipt=Customer,
   payment=Supplier, employee advance=Employee). */
function partySource() {
	if (CUSTMODE === "fj") {
		var pt = fjPartyType();
		if (pt === "Supplier") return { list: (CATALOG && CATALOG.suppliers) || [], label: "supplier_name", pt: "Supplier" };
		if (pt === "Employee") return { list: (CATALOG && CATALOG.employees) || [], label: "employee_name", pt: "Employee" };
	}
	return { list: CUSTOMERS, label: "customer_name", pt: "Customer" };
}
function partyLabelOf(c, src) { return c[src.label] || c.customer_name || c.name; }
function matchCust() {
	var src = partySource(), q = norm(custQ), out = [], w = walkinName();
	for (var i = 0; i < src.list.length; i++) {
		var c = src.list[i];
		if (src.pt === "Customer" && c.name === w) continue;
		if (q) {
			var hay = norm(partyLabelOf(c, src)) + " " + norm(c.name) + " " + norm(c.mobile_no) + " " + norm(c.custom_village) + " " + norm(c.custom_alias);
			if (hay.indexOf(q) === -1) continue;
		}
		out.push(c);
		if (out.length >= 40) break;
	}
	return out;
}
function partyHeading() {
	if (CUSTMODE !== "fj") return T("cust");
	var pt = fjPartyType();
	return pt === "Supplier" ? T("fj_supplier") : pt === "Employee" ? T("fj_employee") : T("cust");
}
function renderCustSheet() {
	var src = partySource();
	/* quick-add is Customer-only (cart, or an FJ receipt) — never for suppliers/employees */
	var canAdd = src.pt === "Customer";
	var h = '<div class="sheet" onclick="event.stopPropagation()">' +
		'<div class="shh"><div class="t">' + esc(partyHeading()) + '</div><button class="x" onclick="closeCust()">&#10005;</button></div>' +
		'<div class="sq"><input id="cq" placeholder="' + esc(T("search_ph")) + '" value="' + esc(custQ) + '" oninput="onCQ(this.value)"></div>';

	h += '<div class="newc">';

	h += "</div>";

		h += '<div class="newform">' +
			'<input id="ncn" placeholder="' + esc(T("cust_name")) + ' *" value="">' +

}
function custListHtml() {
	var src = partySource(), rows = matchCust(), h = "";
	var w = walkinName();
	/* walk-in row only for a cart sale — a khata receipt or any FJ party needs a real party */
	if (CUSTMODE !== "fj") {
		h += '<div class="crow" onclick="pickWalkin()"><div class="ci2">₹</div><div class="cm"><div class="cn2">' + esc(w) + '</div><div class="cd2">' + esc(T("walkin")) + "</div></div></div>";
	}
	for (var i = 0; i < rows.length; i++) {

var _lastMatch = [];
function onCQ(v) { custQ = v; _lastMatch = matchCust(); var el = $id("clist"); if (el) el.innerHTML = custListHtml(); }
function pickWalkin() { CUST = null; KHATA = null; closeCust(); render(); }
function pickCust(i) {
	var src = partySource(), rows = matchCust();
	var c = rows[i];
	if (!c) return;
	if (CUSTMODE === "fj") {
		/* store a normalized {name, label} so FJ display + posting work for any party type */
		if (FJ) { FJ.cust = { name: c.name, label: partyLabelOf(c, src) }; renderFJ(); }

function commonGroup() {
	var gc = {};
	for (var i = 0; i < CUSTOMERS.length; i++) { var g = CUSTOMERS[i].customer_group || ""; if (g) gc[g] = (gc[g] || 0) + 1; }
	var best = "", bn = 0;
	for (var k in gc) if (gc[k] > bn) { bn = gc[k]; best = k; }
	return best || "Individual";
}
function createCust() {
	var nm = (($id("ncn") || {}).value || "").trim();
	var mb = (($id("ncm") || {}).value || "").trim();
	var vl = (($id("ncv") || {}).value || "").trim();
	if (!nm) { toast(T("need_name")); return; }
	var payload = { customer_name: nm, customer_group: commonGroup(), territory: "All Territories" };
	if (mb) payload.mobile_no = mb;
	if (vl) payload.custom_village = vl;
	api("/api/resource/Customer", { method: "POST", json: payload }).then(function (d) {
		var doc = d.data || {};
		var c = { name: doc.name, customer_name: doc.customer_name || nm, mobile_no: mb, custom_village: vl, customer_group: payload.customer_group };
		CUSTOMERS.unshift(c);
		if (CATALOG) { CATALOG.customers = CUSTOMERS; idbKPut("catalog", CATALOG).catch(function () { }); }
		CUST = c; KHATA = null;
		toast(T("cust_made"));
		closeCust(); render();
	}).catch(function (e) {
		toast((e && e.message) || "?");
	});
}

/* ---------- fast journal (⚡) ----------
   Rides the existing fast_voucher Server Scripts (staging-only today; the
   header button appears only where fast_voucher_config answers enabled=1 —
   the same absence-gate the desk Cash Desk button uses). Mirrors the desk
   Fast Journal's voucher types, gated on what the site's config advertises:
     receipt   -> money IN from a Customer (khata collection)  [to_account]
     payment   -> money OUT to a Supplier                      [from_account]
     expense   -> shop expense paid from a drawer              [from/head]
     advance   -> cash advance to an Employee                  [from_account]
   Every post is a native, cancellable Payment Entry / Journal Entry built
   server-side; postings run with the signed-in user's permissions. */
var FJCFG = null, FJ = null;
function probeFJ() {
	api("/api/method/fast_voucher_config", { method: "POST", json: {} }).then(function (d) {
		var m = d.message;
		FJCFG = m && m.enabled && m.drawers && m.drawers.length ? m : null;
		if (FJCFG) render();
	}).catch(function () { FJCFG = null; });
}
/* voucher types this site supports, in counter order */
function fjTypes() {
	var t = [{ k: "receipt", label: T("fj_receipt") }, { k: "payment", label: T("fj_payment") }];
	var ex = (FJCFG && FJCFG.extra_types) || [];
	if (ex.indexOf("Expense") >= 0 && FJCFG.expense_quick_heads && FJCFG.expense_quick_heads.length)
		t.push({ k: "expense", label: T("fj_expense") });
	if (FJCFG && FJCFG.employee_advance_account) t.push({ k: "employee_advance", label: T("fj_advance") });
	return t;
}
/* which party list the sheet's party row draws from for this voucher type */
function fjPartyType() {
	if (!FJ) return "Customer";
	if (FJ.type === "payment") return "Supplier";
	if (FJ.type === "employee_advance") return "Employee";
	return "Customer";
}
function openFJ() {
	if (!FJCFG) return;
	var cash = null;
	for (var i = 0; i < FJCFG.drawers.length; i++) { if (FJCFG.drawers[i].type === "Cash") { cash = FJCFG.drawers[i].account; break; } }
	FJ = { type: "receipt", cust: null, amount: 0, remark: "", sending: 0, drawer: cash || FJCFG.drawers[0].account, expHead: null };
	/* suppliers/employees may be missing from an older cached catalog — pull once */
	if (!(CATALOG && CATALOG.suppliers)) refreshCatalog(true).then(function () { if (FJ) renderFJ(); }).catch(function () { });
	renderFJ();
	$id("fjovl").classList.add("show");
}
function closeFJ() { FJ = null; var o = $id("fjovl"); if (o) o.classList.remove("show"); }
function fjReady() {
	if (!FJ || !(FJ.amount > 0) || !FJ.drawer) return false;
	if (FJ.type === "expense") return !!FJ.expHead;
	return !!FJ.cust;
}
function renderFJ() {
	if (!FJ) return;
	var types = fjTypes();
	var h = '<div class="sheet fjsheet" onclick="event.stopPropagation()">' +
		'<div class="shh"><div class="t">&#9889; ' + esc(T("fj_title")) + '</div><button class="x" onclick="closeFJ()">&#10005;</button></div>' +
		'<div class="fjtypes">';
	for (var i = 0; i < types.length; i++)
		h += '<button class="' + (FJ.type === types[i].k ? "on" : "") + '" data-k="' + types[i].k + '" onclick="fjSetType(this.dataset.k)">' + esc(types[i].label) + "</button>";
	h += "</div>";
	if (FJ.type === "expense") {
		h += '<div class="fjlbl">' + esc(T("fj_exp_head")) + '</div><div class="fjdraw">';
		var heads = FJCFG.expense_quick_heads || [];
		for (var e = 0; e < heads.length; e++)
			h += '<button class="' + (FJ.expHead === heads[e] ? "on" : "") + '" data-a="' + esc(heads[e]) + '" onclick="fjExpHead(this.dataset.a)">' + esc(heads[e].replace(" - VAC", "")) + "</button>";
		h += "</div>";
	} else {
		var plabel = FJ.type === "payment" ? T("fj_supplier") : FJ.type === "employee_advance" ? T("fj_employee") : T("cust");
		h += '<div class="fjrow" onclick="openCust(\'fj\')"><span class="fl">' + esc(plabel) + '</span><span class="fv">' + esc(FJ.cust ? FJ.cust.label : T("fj_pick")) + "</span></div>";
	}
	h += '<div class="fjrow" onclick="fjAmt()"><span class="fl">' + esc(T("fj_amt")) + '</span><span class="fv">' + (FJ.amount ? fmt(FJ.amount) : "—") + "</span></div>";
	h += '<div class="fjlbl">' + esc(FJ.type === "receipt" ? T("fj_deposit_to") : T("fj_paid_from")) + '</div><div class="fjdraw">';
	for (var d = 0; d < FJCFG.drawers.length; d++) {
		var dr = FJCFG.drawers[d];
		h += '<button class="' + (FJ.drawer === dr.account ? "on" : "") + '" data-a="' + esc(dr.account) + '" onclick="fjDrawer(this.dataset.a)">' + esc(dr.account.replace(" - VAC", "")) + "</button>";
	}
	h += "</div>" +
		'<input class="fr" id="fjrm" placeholder="' + esc(T("fj_remark")) + '" value="' + esc(FJ.remark) + '" onchange="if(FJ)FJ.remark=this.value">' +
		'<button class="gobtn" onclick="fjGo()"' + (fjReady() && !FJ.sending ? "" : " disabled") + ">" +
		esc(T("fj_go")) + (FJ.amount ? " " + fmt(FJ.amount) : "") + "</button></div>";
	$id("fjovl").innerHTML = h;
}
function fjSetType(k) { if (!FJ) return; FJ.type = k; FJ.cust = null; FJ.expHead = null; renderFJ(); }
function fjDrawer(a) { if (FJ) { FJ.drawer = a; renderFJ(); } }
function fjExpHead(a) { if (FJ) { FJ.expHead = a; renderFJ(); } }
function fjAmt() { openNum(T("fj_title"), T("fj_amt"), FJ.amount || "", function (v) { if (FJ) { FJ.amount = v; renderFJ(); } }); }
function fjGo() {
	if (!FJ || FJ.sending) return;
	if (!fjReady()) { toast(T("fj_need")); return; }
	var thr = (FJCFG && FJCFG.amount_confirm_threshold) || 0;
	if (thr && FJ.amount >= thr && !confirm(T("fj_big") + " " + fmt(FJ.amount) + "?")) return;
	var p = { amount: FJ.amount, remark: FJ.remark || ("POS PWA " + FJ.type), posting_date: today() };
	if (FJ.type === "receipt") { p.vtype = "receipt"; p.party_type = "Customer"; p.party = FJ.cust.name; p.to_account = FJ.drawer; }
	else if (FJ.type === "payment") { p.vtype = "payment"; p.party_type = "Supplier"; p.party = FJ.cust.name; p.from_account = FJ.drawer; }
	else if (FJ.type === "employee_advance") { p.vtype = "employee_advance"; p.party = FJ.cust.name; p.from_account = FJ.drawer; }
	else if (FJ.type === "expense") { p.vtype = "expense"; p.from_account = FJ.drawer; p.to_account = FJ.expHead; }
	else { toast("?"); return; }
	var wasCust = (FJ.type === "receipt" && FJ.cust) ? FJ.cust.name : null;
	FJ.sending = 1; renderFJ();
	api("/api/method/fast_voucher_post", { method: "POST", json: p }).then(function (d) {
		var m = d.message || {};
		toast(T("fj_done") + (m.name || ""));
		/* a khata receipt for the customer on screen -> refresh their balance */
		if (wasCust && CUST && CUST.name === wasCust) { KHATA = null; loadKhata(); }
		closeFJ();
	}).catch(function (e) {
		if (FJ) { FJ.sending = 0; renderFJ(); }
		if (e && e.auth) { toast(T("fj_perm")); return; }
		toast((e && e.message) || "?");
	});
}

/* ---------- settings ---------- */
function renderSettings() {
	var h = '<div class="backrow"><button onclick="go(\'sell\')">&larr; ' + esc(T("sell")) + "</button></div>";
	h += '<div class="sec"><div class="sh">' + esc(T("set")) + "</div>" +
		'<div class="setrow"><label>' + esc(T("set_dev")) + '</label><input value="' + esc(S.device) + '" onchange="chS(\'device\',this.value)"></div>' +
		'<div class="setrow"><label>' + esc(T("set_prof")) + '</label><input value="' + esc(S.profile) + '" onchange="chS(\'profile\',this.value)"></div>' +
		'<div class="togrow"><div class="tl2">' + esc(T("set_autop")) + '</div><div class="tog' + (S.autoprint ? " on" : "") + '" onclick="togAuto()"></div></div>' +
		'<div class="setrow" style="margin-top:12px"><label>' + esc(T("set_lang")) + '</label><div class="langrow2">' +
		LANGS.map(function (l) { return '<button class="' + (l.code === LANG ? "on" : "") + '" onclick="setLang(\'' + l.code + '\')">' + esc(l.label) + "</button>"; }).join("") +
		"</div></div></div>";
	h += '<div class="sec"><div class="sh">' + esc(T("set_shop")) + "</div>" +
		'<div class="setrow"><label>' + esc(T("set_sn")) + '</label><input value="' + esc(S.shop_name) + '" onchange="chS(\'shop_name\',this.value)"></div>' +
		'<div class="setrow"><label>' + esc(T("set_ss")) + '</label><input value="' + esc(S.shop_sub) + '" onchange="chS(\'shop_sub\',this.value)"></div>' +
		'<div class="setrow"><label>' + esc(T("set_sg")) + '</label><input value="' + esc(S.shop_gstin) + '" onchange="chS(\'shop_gstin\',this.value)"></div>' +
		'<div class="setrow"><label>' + esc(T("set_sp")) + '</label><input value="' + esc(S.shop_phone) + '" onchange="chS(\'shop_phone\',this.value)"></div></div>';
	h += '<div class="sec">' +
		'<button class="setbtn act" onclick="doRefresh()">' + esc(T("set_refresh")) + "</button>" +
		'<button class="setbtn warn" onclick="doLogout()">' + esc(T("set_logout")) + "</button>";
	h += '<details style="margin-top:12px"><summary style="color:var(--muted);font-size:.85rem;font-weight:700">' + esc(T("set_adv")) + "</summary>" +
		'<div class="setrow" style="margin-top:10px"><label>' + esc(T("set_token")) + '</label><input id="tok" type="password" value="' + esc(TOKEN) + '"></div>' +
		'<button class="setbtn" onclick="saveTok()">' + esc(T("set_save")) + "</button></details>";
	h += '<div class="vtag">' + esc(POSV) + " • " + esc(S.profile) + "</div></div>";
	return h;
}
function chS(k, v) { S[k] = String(v).trim(); saveS(); render(); }
function togAuto() { S.autoprint = S.autoprint ? 0 : 1; saveS(); render(); }
function doRefresh() {
	toast("…");
	refreshCatalog(true).then(function () { toast(T("refreshed")); render(); })
		.catch(function (e) {
			if (e && e.auth) { needLogin(); return; }
			if (e && e.notfound) { disabledCheck(); return; }
			toast((e && e.message) || "?");
		});
}
function saveTok() {
	var v = (($id("tok") || {}).value || "").trim();
	TOKEN = v;
	if (v) LS.vacpos_token = v; else LS.removeItem("vacpos_token");
	boot();
}
function disabledCheck() { DISABLED = true; render(); }

/* ---------- authentication (device token OR email + password session) ---------- */
function ensureAuth() {
	if (!navigator.onLine) {
		AUTHED = LS.vacpos_authed === "1";
		if (AUTHED && !AUTH) { try { AUTH = JSON.parse(LS.vacpos_auth || "null"); } catch (e) { } }
		if (AUTH && AUTH.can_journal) CANJOURNAL = true;
		return Promise.resolve(AUTHED);
	}
	if (TOKEN) {
		return api("/api/method/vac_pos_ping").then(function (d) {
			var m = d.message || {};
			AUTH = { user: m.user, full_name: m.user }; AUTHED = true;
			CANJOURNAL = !!m.can_journal;
			LS.vacpos_authed = "1"; LS.vacpos_auth = JSON.stringify({ user: m.user, full_name: m.user, can_journal: CANJOURNAL });
			return true;
		}).catch(function (e) {
			if (e && e.notfound) { DISABLED = true; return false; }
			AUTHED = false; LS.removeItem("vacpos_authed");
			return false;
		});
	}
	return fetch("/api/method/agriops_suite.pos_pwa.csrf", { credentials: "same-origin" })
		.then(function (r) { return r.ok ? r.json() : null; })
		.then(function (j) {
			var m = j && j.message;
			if (m && m.csrf_token) {
				CSRF = m.csrf_token; AUTH = m; AUTHED = true;
				CANJOURNAL = !!m.can_journal;
				LS.vacpos_authed = "1"; LS.vacpos_auth = JSON.stringify({ user: m.user, full_name: m.full_name, can_journal: CANJOURNAL });
				return true;
			}
			AUTHED = false; LS.removeItem("vacpos_authed");
			return false;
		})
		.catch(function () { AUTHED = LS.vacpos_authed === "1"; return AUTHED; });
}
function needLogin() {
	AUTHED = false; CSRF = ""; LS.removeItem("vacpos_authed");
	renderLogin("");
}
function renderLogin(err) {
	var langs = "";
	LANGS.forEach(function (l) {
		langs += '<button class="' + (l.code === LANG ? "on" : "") + '" onclick="setLang(\'' + l.code + '\')">' + esc(l.label) + "</button>";
	});
	$id("app").innerHTML =
		'<div class="pairwrap"><div class="logo">₹</div>' +
		"<h1>" + esc(T("login_h")) + "</h1>" +
		'<div class="langrow">' + langs + "</div>" +
		"<p>" + esc(T("login_sub")) + "</p>" +
		'<input id="lem" type="email" inputmode="email" placeholder="' + esc(T("login_email")) + '" autocapitalize="off" autocorrect="off" spellcheck="false">' +
		'<input id="lpw" type="password" placeholder="' + esc(T("login_pw")) + '">' +
		'<button class="go" id="lbtn" onclick="doLogin()">' + esc(T("login_go")) + "</button>" +
		'<div class="pairerr">' + esc(err || "") + "</div></div>";
	var pw = $id("lpw");
	if (pw) pw.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
}
function doLogin() {
	var email = (($id("lem") || {}).value || "").trim();
	var pw = ($id("lpw") || {}).value || "";
	if (!email || !pw) { renderLogin(T("login_bad")); if ($id("lem")) $id("lem").value = email; return; }
	var btn = $id("lbtn");
	if (btn) { btn.disabled = true; btn.textContent = T("login_ing"); }
	fetch("/api/method/login", {
		method: "POST",
		headers: { "Content-Type": "application/x-www-form-urlencoded" },
		body: "usr=" + encodeURIComponent(email) + "&pwd=" + encodeURIComponent(pw),
		credentials: "same-origin"
	}).then(function (r) {
		if (r.status === 429) throw { m: T("login_locked") };
		if (!r.ok) throw { m: T("login_bad") };
		return ensureAuth();
	}).then(function (ok) {
		if (!ok) throw { m: T("login_bad") };
		boot();
	}).catch(function (e) {
		renderLogin(e && e.m ? e.m : T("login_net"));
		if ($id("lem")) $id("lem").value = email;
	});
}
function doLogout() {
	if (!confirm(T("logout_q"))) return;
	fetch("/api/method/logout", { credentials: "same-origin" })
		.catch(function () { }).then(function () {
			CSRF = ""; AUTHED = false; AUTH = null; TOKEN = "";
			LS.removeItem("vacpos_authed"); LS.removeItem("vacpos_token");
			toast(T("bye"));
			renderLogin("");
		});
}

/* ---------- net ---------- */
function updateNet() {
	var d = $id("netdot");
	if (d) d.className = "netdot" + (navigator.onLine ? "" : " off");
	if (AUTHED) render();
}

/* ---------- boot ---------- */
function boot() {
	applyLangChrome();
	/* numovl must be inserted LAST: the numpad opens on top of the FJ sheet */
	document.body.insertAdjacentHTML("beforeend", '<div class="ovl" id="custovl" onclick="closeCust()"></div>');
	document.body.insertAdjacentHTML("beforeend", '<div class="ovl" id="fjovl" onclick="closeFJ()"></div>');
	document.body.insertAdjacentHTML("beforeend", '<div class="ovl" id="numovl" onclick="closeNum()"></div>');
	["custovl", "fjovl", "numovl"].forEach(function (id) {
		var old = document.querySelectorAll("#" + id);
		for (var i = 0; i < old.length - 1; i++) old[i].parentNode.removeChild(old[i]);
	});
	loadDone();
	loadHolds();
	ensureAuth().then(function (authed) {
		if (DISABLED) { renderDisabled(); return; }
		if (!authed) { renderLogin(""); return; }
		Promise.all([
			idbKGet("catalog").catch(function () { return null; }),
			idbQAll().catch(function () { return []; })
		]).then(function (rs) {
			if (rs[0]) adoptCatalog(rs[0]);
			queue = rs[1] || [];
			/* anything stuck in "sending" from a killed tab goes back to pending */
			for (var i = 0; i < queue.length; i++) if (queue[i].status === "sending") queue[i].status = "pending";
			queue.sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
			render();
			probeFJ();
			return refreshCatalog(!CATALOG);
		}).then(function (changed) {
			if (changed) render();
			syncNow(false);
		}).catch(function (e) {
			if (e && e.auth) { needLogin(); return; }
			if (e && e.notfound) { disabledCheck(); return; }
			if (e && e.message) toast(e.message);
		});
	});
}

window.addEventListener("online", function () { updateNet(); syncNow(false); });
window.addEventListener("offline", updateNet);
var _rz = null;
window.addEventListener("resize", function () {
	clearTimeout(_rz);
	_rz = setTimeout(function () { if (AUTHED && !DISABLED) render(); }, 150);
});
document.addEventListener("visibilitychange", function () { if (!document.hidden && AUTHED) syncNow(false); });
setInterval(function () { if (AUTHED && queue.length) syncNow(false); }, 25000);

if ("serviceWorker" in navigator && location.pathname === "/pos") {
	try { navigator.serviceWorker.register("/api/method/agriops_suite.pos_pwa.sw", { scope: "/pos" }).catch(function () { }); } catch (e) { }
}

boot();
</script>
{% endraw %}
</body>
</html>
